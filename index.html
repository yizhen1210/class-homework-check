                    selSubj.innerHTML = '<option value="">請先選擇科目</option>' + Object.keys(bySubject).map(subjName=>`<option value="${subjName}">${subjName}</option>`).join('');
                    selSubj.value = Object.keys(bySubject).includes(curSubjSel) ? curSubjSel : '';
                    selSubj.onchange = () => { refreshPastAssignmentOptions(); renderPastAssignmentGrader(); };
                    refreshPastAssignmentOptions();
                }

                function renderPastAssignmentGrader(){
                    const aid = selPast.value;
                    const box = $('pastAssignmentGradeList');
                    if(!aid){ box.innerHTML = ''; return; }
                    const aName = knownPast[aid] ? knownPast[aid].name : '';
                    const isPastDaily = aName === '聯絡簿每日任務';
                    const gradeOfPast = sid => gradingRecs.find(x=>x.studentId===sid && x.assignmentId===aid);
                    const pastSubjName = knownPast[aid] ? (knownPast[aid].subjectName||'') : '';
                    const dSubj = isPastDaily ? st.subjects.find(x=>x.id===(st.assignments.find(a=>a.name==='聯絡簿每日任務')||{}).subjectId) : st.subjects.find(x=>x.name===pastSubjName);
                    // 這份作業已經不在目前作業清單了，沒有 needsSign 欄位可以查，
                    // 用「這個作業的紀錄裡有沒有人寫過 signStatus」來判斷它當初是不是需要簽名的作業。
                    const pastInfo = knownPast[aid];
                    const pastNeedsSign = pastInfo && pastInfo.needsSign !== undefined
                        ? pastInfo.needsSign
                        : (isPastDaily || records.some(r => r.assignmentId === aid && r.signStatus !== undefined));
                    box.innerHTML = sortBySeat(st.students).map(s => {
                        const rowClass = 'daily-row' + (pastNeedsSign ? ' with-sign' : '');
                        if(isPulledOut(s, pastSubjName)) return `<div class="${rowClass}">
                            <span class="student-name">${s.name}</span>
                            <span class="row-slot-pill"><span class="pulled-out-pill">抽離</span></span>
                            ${pastNeedsSign ? `<span class="row-slot-pill"></span>` : ''}
                            <span class="row-slot-icon"></span>
                            <span class="row-slot-icon"></span>
                            <span class="row-slot-corrected"></span>
                            <span class="row-slot-icon"></span>
                        </div>`;
                        const g = gradeOfPast(s.id);
                        const cur = g ? g.correctness : '';
                        const thirdVal = isPastDaily ? '沒寫任務' : '遺失';
                        const thirdIcon = isPastDaily ? '－' : '✗';
                        const rec = records.find(r=>r.studentId===s.id && r.assignmentId===aid);
                        const dStatus = rec ? rec.status : '未繳';
                        const dSign = (rec && rec.signStatus) ? rec.signStatus : '未簽名';
                        const showCorrected = cur==='有錯';
                        return `<div class="${rowClass}" data-past-student="${s.id}">
                            <span class="student-name">${s.name}</span>
                            <span class="row-slot-pill"><button type="button" class="toggle-pill ${dStatus==='已繳'?'submitted':'missing'}" data-past-status-toggle>${dStatus}</button></span>
                            ${pastNeedsSign ? `<span class="row-slot-pill">${dStatus==='已繳' ? `<button type="button" class="toggle-pill ${dSign==='已簽名'?'submitted':'unsigned'}" data-past-sign-toggle>${dSign}</button>` : ''}</span>` : ''}
                            <span class="row-slot-icon"><button type="button" class="grade-btn ${cur==='全對'?'active g-ok':''}" data-past-grade="全對" title="全對">✓</button></span>
                            <span class="row-slot-icon"><button type="button" class="grade-btn ${cur==='有錯'?'active g-err':''}" data-past-grade="有錯" title="有錯">▲</button></span>
                            <span class="row-slot-corrected">${showCorrected ? `<button type="button" class="corrected-btn ${g&&g.corrected?'active':''}" data-past-corrected="1">${g&&g.corrected?'✓訂正':'訂正'}</button>` : ''}</span>
                            <span class="row-slot-icon"><button type="button" class="grade-btn ${cur===thirdVal?'active g-lost':''}" data-past-grade="${thirdVal}" title="${thirdVal}">${thirdIcon}</button></span>
                            ${pointsOf(g)>0 ? `<span class="empty-hint" style="padding:0">${g.pointsGiven?'已加點':'尚未加點'}</span>` : ''}
                        </div>`;
                    }).join('');
                    box.querySelectorAll('[data-past-status-toggle]').forEach(btn => btn.onclick = async () => {
                        const row = btn.closest('.daily-row');
                        const sid = row.getAttribute('data-past-student');
                        const stu = st.students.find(x=>x.id===sid);
                        const grp = st.groups.find(x=>x.id===stu?.groupId);
                        const cur2 = records.find(r=>r.studentId===sid && r.assignmentId===aid);
                        const nv = (cur2 && cur2.status === '已繳') ? '未繳' : '已繳';
                        const payload = {
                            groupId: grp?grp.id:'', groupName: grp?grp.name:'',
                            studentId: sid, studentName: stu?stu.name:'',
                            subjectId: dSubj?dSubj.id:'', subjectName: dSubj?dSubj.name:'',
                            assignmentId: aid, assignmentName: aName,
                            status: nv
                        };
                        if(nv !== '已繳') payload.signStatus = '未簽名';
                        await adminSetStatus(payload);
                        let r = records.find(x=>x.studentId===sid && x.assignmentId===aid);
                        if(r) Object.assign(r, payload); else records.push(payload);
                        renderPastAssignmentGrader();
                    });
                    box.querySelectorAll('[data-past-sign-toggle]').forEach(btn => btn.onclick = async () => {
                        const row = btn.closest('.daily-row');
                        const sid = row.getAttribute('data-past-student');
                        const stu = st.students.find(x=>x.id===sid);
                        const grp = st.groups.find(x=>x.id===stu?.groupId);
                        const cur2 = records.find(r=>r.studentId===sid && r.assignmentId===aid);
                        const nv = (cur2 && cur2.signStatus === '已簽名') ? '未簽名' : '已簽名';
                        await adminSetStatus({
                            groupId: grp?grp.id:'', groupName: grp?grp.name:'',
                            studentId: sid, studentName: stu?stu.name:'',
                            subjectId: dSubj?dSubj.id:'', subjectName: dSubj?dSubj.name:'',
                            assignmentId: aid, assignmentName: aName,
                            signStatus: nv
                        });
                        let r = records.find(x=>x.studentId===sid && x.assignmentId===aid);
                        if(r) r.signStatus = nv;
                        renderPastAssignmentGrader();
                    });
                    box.querySelectorAll('[data-past-grade]').forEach(btn => btn.onclick = async () => {
                        const row = btn.closest('.daily-row');
                        const sid = row.getAttribute('data-past-student');
                        const stu = st.students.find(x=>x.id===sid);
                        const val = btn.getAttribute('data-past-grade');
                        const g = gradeOfPast(sid);
                        const nextVal = (g && g.correctness === val) ? '' : val;
                        await adminSetGrading({
                            studentId: sid, studentName: stu?stu.name:'',
                            assignmentId: aid, assignmentName: aName,
                            correctness: nextVal,
                            corrected: nextVal === '有錯' ? (g?g.corrected:false) : false
                        });
                    });
                    box.querySelectorAll('[data-past-corrected]').forEach(btn => btn.onclick = async () => {
                        const row = btn.closest('.daily-row');
                        const sid = row.getAttribute('data-past-student');
                        const stu = st.students.find(x=>x.id===sid);
                        const g = gradeOfPast(sid);
                        await adminSetGrading({
                            studentId: sid, studentName: stu?stu.name:'',
                            assignmentId: aid, assignmentName: aName,
                            correctness: '有錯',
                            corrected: !(g && g.corrected)
                        });
                    });
                }
                if(selPast){ selPast.onchange = renderPastAssignmentGrader; renderPastAssignmentGrader(); }

                $('loadPastArchivesBtn').onclick = async () => {
                    try {
                        const snap = await getDocs(query(archivesColl, orderBy('timestamp','desc')));
                        window.__extraPastAssignments = window.__extraPastAssignments || {};
                        snap.docs.forEach(d => {
                            const data = d.data();
                            const dateLabel = data.dateLabel || new Date(data.timestamp).toLocaleDateString('zh-TW');
                            (data.assignments||[]).forEach(a => {
                                if(!currentIds.has(a.id) && !window.__extraPastAssignments[a.id]) window.__extraPastAssignments[a.id] = { name: a.name, dateLabel, subjectName: a.subjectName || '未分類', needsSign: !!a.needsSign };
                            });
                        });
                        renderGradingTab(gradingRecs, recs, st);
                        window.showAlert('已載入歷史封存的作業清單，請在上方下拉選單選擇');
                    } catch(e){ console.warn(e); window.showAlert('載入失敗，請檢查網路後重試'); }
                };
                $('deleteSelectedPastBtn').onclick = async () => {
                    const aid = selPast.value;
                    if(!aid){ window.showAlert('請先在上面選一筆要刪除的作業'); return; }
                    const info = knownPast[aid];
                    const label = info ? `${info.dateLabel ? info.dateLabel+' ' : ''}${info.name}` : aid;
                    const ok2 = await window.askConfirm(`確定要刪除「${label}」這筆紀錄嗎？裡面的訂正與繳交資料都會刪除，無法復原。`);
                    if(!ok2) return;
                    await clearGradingForAssignment(aid);
                    await clearRecordsForAssignment(aid);
                    if(window.__extraPastAssignments) delete window.__extraPastAssignments[aid];
                    window.showAlert(`已刪除「${label}」`);
                };
                $('showPastMissingBtn').onclick = () => {
                    $('missingListTitle').textContent = '過去作業：未繳與未訂正清單';
                    if(!pastOptions.length){
                        $('missingListBody').innerHTML = '<p>目前沒有已封存的作業紀錄（可以先按「載入更多歷史作業」）</p>';
                    } else {
                        const blocks = pastOptions.map(([id, info]) => {
                            const label = `${info.dateLabel ? info.dateLabel+' ' : ''}${info.name}`;
                            const isPastDailyItem = info.name === '聯絡簿每日任務';
                            const applicable = sortBySeat(st.students).filter(s => !isPulledOut(s, info.subjectName||''));
                            const missing = applicable.filter(s => {
                                const g = gradingRecs.find(x=>x.studentId===s.id && x.assignmentId===id);
                                if(g && g.correctness === '遺失') return false; // 已標記遺失的不重複算進未繳，歸類在遺失清單即可
                                const rec = records.find(r=>r.studentId===s.id && r.assignmentId===id);
                                return !rec || rec.status !== '已繳';
                            });
                            const uncorrected = applicable.filter(s => {
                                const g = gradingRecs.find(x=>x.studentId===s.id && x.assignmentId===id);
                                return g && g.correctness === '有錯' && !g.corrected;
                            });
                            const notWritten = isPastDailyItem ? applicable.filter(s => {
                                const g = gradingRecs.find(x=>x.studentId===s.id && x.assignmentId===id);
                                return g && g.correctness === '沒寫任務';
                            }) : [];
                            if(!missing.length && !uncorrected.length && !notWritten.length) return ''; // 全部都沒人，整項作業跳過
                            const missingLine = missing.length ? `<p style="margin:0 0 4px;color:var(--muted)">未繳：${missing.map(s=>s.name).join('、')}</p>` : '';
                            const uncorrectedLine = uncorrected.length ? `<p style="margin:0 0 4px;color:var(--muted)">未訂正：${uncorrected.map(s=>s.name).join('、')}</p>` : '';
                            const notWrittenLine = notWritten.length ? `<p style="margin:0 0 14px;color:var(--muted)">沒寫任務：${notWritten.map(s=>s.name).join('、')}</p>` : '';
                            return `<p style="margin-bottom:4px"><strong>${label}</strong></p>${missingLine}${uncorrectedLine}${notWrittenLine}`;
                        }).filter(html => html);
                        $('missingListBody').innerHTML = blocks.length ? blocks.join('') : '<p class="empty-hint">目前沒有任何未繳或未訂正的項目</p>';
                    }
                    $('missingListModal').style.display = 'flex';
                };
                $('showPastLostBtn').onclick = () => {
                    $('missingListTitle').textContent = '過去作業：遺失清單';
                    const countByStudent = {}; // studentId -> count
                    let totalCount = 0;
                    pastOptions.forEach(([id]) => {
                        gradingRecs.filter(g => g.assignmentId === id && g.correctness === '遺失').forEach(g => {
                            totalCount++;
                            countByStudent[g.studentId] = (countByStudent[g.studentId] || 0) + 1;
                        });
                    });
                    const studentsWithLost = Object.keys(countByStudent).map(id => st.students.find(x=>x.id===id)).filter(Boolean);
                    const list = sortBySeat(studentsWithLost);
                    let html = `<p style="margin-bottom:14px"><strong>共 ${totalCount} 項遺失作業</strong></p>`;
                    html += list.length
                        ? list.map(s => `<p style="margin:0 0 6px">${s.seat!=null && s.seat!=='' ? s.seat+'號 ' : ''}${s.name}：${countByStudent[s.id]}項</p>`).join('')
                        : '<p class="empty-hint">目前沒有標記遺失的作業</p>';
                    $('missingListBody').innerHTML = html;
                    $('missingListModal').style.display = 'flex';
                };
            }

            const thead = $('gradeThead');
            thead.innerHTML = '<tr><th>學生</th>' + assignments.map(a=>`<th>${a.name}</th>`).join('') + '</tr>';
            const tbody = $('gradeTbody');
            tbody.innerHTML = students.length ? students.map(s => {
                const cells = assignments.map(a => {
                    if(isPulledOut(s, subjNameOf(a))) return `<td><span class="cell-pulled-out">抽離</span></td>`;
                    const g = gradeOf(s.id, a.id);
                    const cur = g ? g.correctness : '';
                    const isDaily = a.name === '聯絡簿每日任務';
                    if(statusOf(s.id, a.id) !== '已繳'){
                        // 缺交狀態下，遺失可以直接標記（東西不見了不需要先勾已繳），聯絡簿沒有遺失概念故不提供
                        if(isDaily) return `<td><span class="grade-missing">缺交</span></td>`;
                        if(cur === '遺失'){
                            return `<td><div class="cell-stack"><span class="grade-missing">缺交</span><button type="button" class="grade-btn active g-lost" data-grade-student="${s.id}" data-grade-assignment="${a.id}" data-grade-value="遺失" title="取消遺失標記">✗</button></div></td>`;
                        }
                        return `<td><div class="cell-stack"><span class="grade-missing">缺交</span><button type="button" class="btn small outline" data-grade-student="${s.id}" data-grade-assignment="${a.id}" data-grade-value="遺失">標記遺失</button></div></td>`;
                    }
                    const thirdBtn = isDaily
                        ? `<button type="button" class="grade-btn ${cur==='沒寫任務'?'active g-lost':''}" data-grade-student="${s.id}" data-grade-assignment="${a.id}" data-grade-value="沒寫任務" title="沒寫任務">－</button>`
                        : `<button type="button" class="grade-btn ${cur==='遺失'?'active g-lost':''}" data-grade-student="${s.id}" data-grade-assignment="${a.id}" data-grade-value="遺失" title="遺失">✗</button>`;
                    const btns = `
                        <div class="mini-status-group">
                            <button type="button" class="grade-btn ${cur==='全對'?'active g-ok':''}" data-grade-student="${s.id}" data-grade-assignment="${a.id}" data-grade-value="全對" title="全對">✓</button>
                            <button type="button" class="grade-btn ${cur==='有錯'?'active g-err':''}" data-grade-student="${s.id}" data-grade-assignment="${a.id}" data-grade-value="有錯" title="有錯">▲</button>
                            ${thirdBtn}
                        </div>`;
                    const correctedBtn = cur === '有錯' ? `<button type="button" class="corrected-btn ${g&&g.corrected?'active':''}" data-corrected-student="${s.id}" data-corrected-assignment="${a.id}">${g&&g.corrected?'✓訂正':'訂正'}</button>` : '';
                    return `<td><div class="cell-stack">${btns}<div class="corrected-slot">${correctedBtn}</div></div></td>`;
                }).join('');
                return `<tr><td>${s.name}</td>${cells}</tr>`;
            }).join('') : '';
            $('gradeEmpty').style.display = students.length && assignments.length ? 'none' : 'block';
            $('gradeEmpty').textContent = !students.length ? '尚未新增學生' : (!assignments.length ? '目前沒有作業' : '');

            tbody.querySelectorAll('[data-grade-value]').forEach(btn => btn.onclick = async () => {
                const sid = btn.getAttribute('data-grade-student'), aid = btn.getAttribute('data-grade-assignment');
                const val = btn.getAttribute('data-grade-value');
                const stu = st.students.find(x=>x.id===sid);
                const a = st.assignments.find(x=>x.id===aid);
                const g = gradeOf(sid, aid);
                const nextVal = (g && g.correctness === val) ? '' : val; // 再點一次同一個＝重設回未評分
                await adminSetGrading({
                    studentId: sid, studentName: stu?stu.name:'',
                    assignmentId: aid, assignmentName: a?a.name:'',
                    correctness: nextVal,
                    corrected: nextVal === '有錯' ? (g?g.corrected:false) : false
                });
            });
            tbody.querySelectorAll('[data-corrected-student]').forEach(btn => btn.onclick = async () => {
                const sid = btn.getAttribute('data-corrected-student'), aid = btn.getAttribute('data-corrected-assignment');
                const stu = st.students.find(x=>x.id===sid);
                const a = st.assignments.find(x=>x.id===aid);
                const g = gradeOf(sid, aid);
                await adminSetGrading({
                    studentId: sid, studentName: stu?stu.name:'',
                    assignmentId: aid, assignmentName: a?a.name:'',
                    correctness: '有錯',
                    corrected: !(g && g.corrected)
                });
            });

            // ---- 加點 ----
            const sel = $('pointsStudentSelect');
            const curSel = sel.value;
            sel.innerHTML = '<option value="">請選擇學生</option>' + students.map(s=>`<option value="${s.id}">${s.name}</option>`).join('');
            sel.value = [...sel.options].some(o=>o.value===curSel) ? curSel : '';

            $('calcPointsBtn').onclick = async () => {
                const sid = sel.value;
                if(!sid){ window.showAlert('請先選擇學生'); return; }
                const stu = st.students.find(x=>x.id===sid);
                if(!stu) return;
                const currentIds = new Set(st.assignments.map(a=>a.id));

                // 檢查目前作業裡，這位學生還有哪些缺交或有錯未訂正（提醒用，不影響已經可以加的點）
                const incomplete = [];
                st.assignments.filter(a => a.name !== '聯絡簿每日任務').forEach(a => {
                    if(isPulledOut(stu, subjNameOf(a))) return;
                    if(statusOf(sid, a.id) !== '已繳'){ incomplete.push(`${a.name}（缺交）`); return; }
                    const g = gradeOf(sid, a.id);
                    if(g && g.correctness === '有錯' && !g.corrected) incomplete.push(`${a.name}（有錯未訂正）`);
                });
                if(incomplete.length){
                    window.showAlert(`「${stu.name}」還有未完成項目，這些不會計點：${incomplete.join('、')}`);
                }

                // 累積但還沒加過點的項目：掃全部 gradingRecords（不限於目前作業，之前封存過的也算）。
                // 若作業還在目前清單裡，要額外用最新的 records 確認目前真的是「已繳」，
                // 避免評過分後又被改回未繳，卻還被算進點數裡。已封存（不在目前清單）的沒有即時狀態可查，沿用當初的評分。
                const eligible = gradingRecs.filter(g => {
                    if(g.studentId !== sid || g.pointsGiven || pointsOf(g) <= 0) return false;
                    if(currentIds.has(g.assignmentId) && statusOf(sid, g.assignmentId) !== '已繳') return false;
                    return true;
                });
                if(!eligible.length){
                    $('pointsResult').innerHTML = `<p class="empty-hint">「${stu.name}」目前沒有可加點的項目${incomplete.length?'（見上方提醒）':''}</p>`;
                    return;
                }
                const items = eligible.map(g => ({
                    assignmentId: g.assignmentId, assignmentName: g.assignmentName,
                    type: g.correctness === '全對' ? '全對' : '訂正完成',
                    points: pointsOf(g)
                }));
                const total = items.reduce((sum,i)=>sum+i.points, 0);
                const ok = await window.askConfirm(`要幫「${stu.name}」加 ${total} 點嗎？`);
                if(!ok) return;

                const batch = writeBatch(db);
                eligible.forEach(g => batch.set(doc(gradingColl, recordDocId(sid, g.assignmentId)), { pointsGiven: true }, { merge: true }));
                await batch.commit().catch(e=>console.warn(e));
                await addDoc(pointLogsColl, {
                    studentId: sid, studentName: stu.name,
                    timestamp: Date.now(), dateLabel: todayStr(),
                    totalPoints: total, items
                }).catch(e=>console.warn(e));
                $('pointsResult').innerHTML = `<p>已幫「${stu.name}」加 <strong>${total}</strong> 點</p>`;
            };

            // ---- 加點紀錄載入／匯出 ----
            $('loadPointLogsBtn').onclick = async () => {
                $('pointLogsList').innerHTML = '<p class="empty-hint">載入中…</p>';
                try {
                    const snap = await getDocs(query(pointLogsColl, orderBy('timestamp','desc')));
                    const list = snap.docs.map(d=>({ id:d.id, ...d.data() }));
                    $('pointLogsList').innerHTML = list.length ? list.map(l => `
                        <div class="assignment-row">
                            <span class="assignment-name">${l.dateLabel||''}　${l.studentName}　+${l.totalPoints}點</span>
                            <button class="btn small outline danger" data-undo-log="${l.id}">撤銷</button>
                        </div>`).join('') : '<p class="empty-hint">尚無加點紀錄</p>';
                    $('pointLogsList').querySelectorAll('[data-undo-log]').forEach(btn => btn.onclick = async () => {
                        const logId = btn.getAttribute('data-undo-log');
                        const item = list.find(x=>x.id===logId);
                        if(!item) return;
                        const ok2 = await window.askConfirm(`撤銷「${item.studentName} +${item.totalPoints}點」這筆加點紀錄嗎？相關項目會恢復成「尚未加點」，可以重新加。`);
                        if(!ok2) return;
                        const undoBatch = writeBatch(db);
                        (item.items||[]).forEach(i => undoBatch.set(doc(gradingColl, recordDocId(item.studentId, i.assignmentId)), { pointsGiven: false }, { merge: true }));
                        undoBatch.delete(doc(db, 'pointLogs', logId));
                        await undoBatch.commit().catch(e=>console.warn(e));
                        $('loadPointLogsBtn').click();
                    });
                } catch(e){ console.warn(e); $('pointLogsList').innerHTML = '<p class="empty-hint">載入失敗</p>'; }
            };
            $('exportTodayPointsBtn').onclick = async () => {
                try {
                    const today = todayStr();
                    const snap = await getDocs(query(pointLogsColl, orderBy('timestamp','desc')));
                    const list = snap.docs.map(d=>d.data()).filter(l => l.dateLabel === today);
                    if(!list.length){ window.showAlert('今天還沒有任何加點紀錄'); return; }
                    const text = list.map(l => `${l.studentName} +${l.totalPoints}點（${(l.items||[]).map(i=>`${i.assignmentName}${i.type}+${i.points}`).join('、')}）`).join('\n');
                    await navigator.clipboard.writeText(`${today} 加點紀錄\n${text}`);
                    window.showAlert('今天的加點紀錄已複製');
                } catch(e){ console.warn(e); window.showAlert('匯出失敗，請檢查網路後重試'); }
            };
        }

        /* ---- 老師後台：三分頁骨架（首次登入建立一次），科目/學生管理清單
               皆用區域刷新，不動到輸入框，避免打字打到一半被清掉）。 ---- */
        // 綁定為「每天一定有」的固定作業：聯絡簿用「日期」當 ID（不是隨機 ID），
        // 這樣每天寫入的都是不同的文件，昨天的資料不會被今天覆蓋，也不需要手動封存——
        // 過了一天，昨天那份就自動變成「已封存作業」，可以直接在「已封存作業的訂正紀錄」picker 找到繼續批改。
        function todayISODate(){
            const d = new Date();
            return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
        }
        const DAILY_FIXED_ASSIGNMENTS = [
            { name: '聯絡簿每日任務', needsSign: true }
        ];
        // 判斷某一天是不是「上課日」：跳過週六日、學期起訖日之外、以及自訂的假日
        function isSchoolDay(dateStr, st){
            const sem = st.semester || {};
            if(sem.skipWeekends !== false){
                const day = new Date(dateStr + 'T00:00:00').getDay(); // 0=週日, 6=週六
                if(day === 0 || day === 6) return false;
            }
            if(sem.startDate && dateStr < sem.startDate) return false;
            if(sem.endDate && dateStr > sem.endDate) return false;
            if(sem.holidays && sem.holidays.includes(dateStr)) return false;
            return true;
        }
        function ensureDailyAssignments(st){
            let changed = false;
            // 自動建立一個獨立的「聯絡簿」科目（如果還沒有），聯絡簿每日任務固定歸在這個科目下，
            // 但這個科目刻意不出現在一般作業的科目下拉選單裡（見 quickAssignmentSubject 建立處）。
            let contactSubj = st.subjects.find(s => s.name === '聯絡簿');
            if(!contactSubj){
                contactSubj = { id: crypto.randomUUID(), name: '聯絡簿', isSystem: true };
                st.subjects = [...st.subjects, contactSubj];
                changed = true;
            }
            const today = todayISODate();
            const schoolDay = isSchoolDay(today, st);
            DAILY_FIXED_ASSIGNMENTS.forEach(fixed => {
                const existing = st.assignments.find(a => a.name === fixed.name);
                if(!existing){
                    // 完全還沒有過，不管今天是不是上課日都先建一份，避免整個功能無法使用
                    st.assignments.push({ id: `daily-${fixed.name}-${today}`, name: fixed.name, subjectId: contactSubj.id, needsSign: fixed.needsSign });
                    changed = true;
                    return;
                }
                if(!schoolDay) return; // 非上課日：維持原本那份不動，不會多出假日的紀錄
                const todayId = `daily-${fixed.name}-${today}`;
                if(existing.id !== todayId){
                    st.assignments = st.assignments.filter(a => a.name !== fixed.name); // 把之前那份從「目前清單」移除，資料本身留在 Firestore 不會刪
                    st.assignments.push({ id: todayId, name: fixed.name, subjectId: contactSubj.id, needsSign: fixed.needsSign });
                    changed = true;
                }
            });
            if(changed) saveSettings({ assignments: st.assignments, subjects: st.subjects });
        }

        function loadEditor(st){
            st = st || { groups: [], students: [], subjects: [], assignments: [] };
            st.groups = st.groups || []; st.students = st.students || [];
            st.subjects = st.subjects || []; st.assignments = st.assignments || [];

            // 這個 st 是登入當下的快照，後續不會隨每次 settings 更新自動換掉（避免打字打到一半被蓋掉）。
            // 但這代表如果資料是從別的地方（例如「今日作業管理」的刪除）改的，這份快照會過期。
            // 所以每個會修改 st 的動作，一律先呼叫這個函式，跟最新的全域 settings 同步，
            // 才不會把舊資料（含已經刪除的作業/學生/組別）整包存回去、變成「復活」。
            function resyncFromGlobal(){
                if(!settings) return;
                st.groups = settings.groups || [];
                st.students = settings.students || [];
                st.subjects = settings.subjects || [];
                st.assignments = settings.assignments || [];
            }
            ensureDailyAssignments(st);

            $('adminArea').innerHTML = `
                <div class="admin-tabs">
                    <button class="tab-btn active" data-tab="tabRecords">查看繳交紀錄</button>
                    <button class="tab-btn" data-tab="tabContact">聯絡簿</button>
                    <button class="tab-btn" data-tab="tabGrading">訂正與加點</button>
                    <button class="tab-btn" data-tab="tabStudents">學生管理</button>
                </div>

                                    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
                                </button>
                                <button type="button" id="deleteSubjectBtn" class="icon-btn" title="刪除選取的科目" style="width:26px;height:26px;background:var(--danger)">
                                    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
                                </button>
                            </div>
                            <input id="quickAssignmentName" class="txt-input" placeholder="新增今日作業，例如：數學習作 P.26-28">
                            <label style="display:flex;align-items:center;gap:6px;white-space:nowrap;font-size:0.9em;color:var(--muted)">

                        </div>
                    </div>
                    <div class="card">
                        <div id="statCards" class="stat-cards"></div>
                    </div>
                    <div class="side-by-side">
                        <div class="card">
                            <h2>今日作業管理</h2>
                            <div id="assignmentMgmtList"></div>
                        </div>
                        <div class="card">
                            <h2>今日快速結算</h2>
                            <p class="empty-hint" style="text-align:left;padding:0 0 14px">小老師登記的紀錄會一直保留，直到你按「結束並封存」（存成歷史紀錄後清空）或「確定完成，直接刪除（不封存）」（不留歷史，直接清空）。</p>

                    <div class="card">
                        <h2>繳交狀態一覽（依座號排序）</h2>

                                <thead id="matrixThead"></thead>

                    <div class="card">

                        <div id="archivesList" style="margin-top:14px"></div>
                    </div>
                </div>
                <div id="tabContact" class="tab-panel" style="display:none">
                    <div class="card">
                        <div id="contactStatCards" class="stat-cards" style="grid-template-columns:repeat(3,1fr)"></div>
                    </div>
                    <div class="card">
                        <h2>聯絡簿每日批改</h2>
                        <p class="empty-hint" style="text-align:left;padding:0 0 10px">一位學生一排，繳交／簽名／批改一次點完，不用切頁面。簽名跟批改要先標記已繳才會出現；再點一次已繳（或已簽名）會恢復成未繳（未簽名）。</p>

                        <button class="btn outline" id="archiveContactBtn">結束今日並封存</button>
                    </div>
                </div>
                <div id="tabGrading" class="tab-panel" style="display:none">
                    <div class="card">
                        <h2>作業對錯與訂正（依座號排序） <button class="btn small outline" id="toggleGradeMatrixBtn" style="margin-left:8px;font-weight:normal">收合</button></h2>
                        <div id="gradeMatrixBody">
                            <p class="empty-hint" style="text-align:left;padding:0 0 10px">紅框＝缺交（還沒繳交，無法評對錯）。已繳的作業可以點選：✓全對／▲有錯／✗遺失；選「有錯」後會多一顆「訂正完成」按鈕。全對 +10 點，訂正完成 +5 點，可以隨時修改重選。</p>
                            <div class="table-scroll">
                                <table>
                                    <thead id="gradeThead"></thead>

                    </div>
                    <div class="card">
                        <h2>已封存作業的訂正紀錄 <button class="btn small outline" id="toggleArchivedGradingBtn" style="margin-left:8px;font-weight:normal">展開</button></h2>
                        <p class="empty-hint" style="text-align:left;padding:0 0 10px">作業被「結束並封存」清空後，矩陣表格看不到欄位，但資料還在。這裡可以選一份過去的作業繼續批改（就算完全還沒批改過也可以，不限於已經評過分的）。</p>
                        <div id="archivedGradingBody" style="display:none">
                            <div class="row" style="margin-bottom:10px">
                                <select id="pastSubjectSelect" style="flex:1"></select>
                                <select id="pastAssignmentSelect" style="flex:1"></select>
                                <button class="btn outline" id="loadPastArchivesBtn">載入更多歷史作業</button>
                                <button class="btn outline danger" id="deleteSelectedPastBtn">刪除選取的這筆</button>

                    renderGroups();
                });
                $('groupsList').querySelectorAll('[data-add-student]').forEach(b => b.onclick = () => {
                    resyncFromGlobal();
                    const gid = b.getAttribute('data-add-student');
                    const nameInp = $('groupsList').querySelector(`[data-new-student="${gid}"]`);
                    const name = nameInp.value.trim();
                    if(!name) return;
                    st.students.push({ id: crypto.randomUUID(), name, groupId: gid });
                    saveSettings({ students: st.students });
                    renderGroups();
                });
            }

            $('addGroupBtn').onclick = () => {
                resyncFromGlobal();
                const name = $('newGroupName').value.trim();
                if(!name) return;
                st.groups.push({ id: crypto.randomUUID(), name });
                saveSettings({ groups: st.groups });
                $('newGroupName').value = '';
                renderGroups();
            };

            $('toggleGradeMatrixBtn').onclick = () => {
                const body = $('gradeMatrixBody');
                const show = body.style.display === 'none';
                body.style.display = show ? 'block' : 'none';
                $('toggleGradeMatrixBtn').textContent = show ? '收合' : '展開';
            };
            $('toggleArchivedGradingBtn').onclick = () => {
                const body = $('archivedGradingBody');
                const show = body.style.display === 'none';
                body.style.display = show ? 'block' : 'none';
                $('toggleArchivedGradingBtn').textContent = show ? '收合' : '展開';
            };
            $('contactViewSeatBtn').onclick = () => { contactViewMode = 'seat'; renderContactTab(records, gradingRecords, st); };
            $('contactViewGroupBtn').onclick = () => { contactViewMode = 'group'; renderContactTab(records, gradingRecords, st); };
            $('archiveContactBtn').onclick = async () => {
                const dailyAsg = st.assignments.find(a => a.name === '聯絡簿每日任務');
                if(!dailyAsg){ window.showAlert('目前沒有「聯絡簿每日任務」這項作業'); return; }
                const dateLabel = await window.askInput('這筆聯絡簿封存要標記的日期（方便日後查看，可修改）', todayStr());
                if(dateLabel === null) return;
                const ok2 = await window.askConfirm('把今天的聯絡簿狀態存成歷史封存紀錄，並換成新的一輪（今天這份會從聯絡簿分頁移除，資料不會被刪除，之後在「已封存作業的訂正紀錄」還能繼續補交/補訂正），確定要繼續嗎？');
                if(!ok2) return;
                const dSubj = st.subjects.find(x=>x.id===dailyAsg.subjectId);
                const students2 = sortBySeat(st.students);
                const snapshotRecords = students2.map(s => {
                    const rec = records.find(r=>r.studentId===s.id && r.assignmentId===dailyAsg.id);
                    const g = gradingRecords.find(x=>x.studentId===s.id && x.assignmentId===dailyAsg.id);
                    return {
                        studentId: s.id, studentName: s.name,
                        assignmentId: dailyAsg.id, assignmentName: dailyAsg.name,
                        status: rec?rec.status:'未繳',
                        signStatus: rec?rec.signStatus:'未簽名',
                        correctness: g?g.correctness:'',
                        corrected: g?g.corrected:false,
                        pulledOut: isPulledOut(s, dSubj?dSubj.name:'')
                    };
                });
                await addDoc(archivesColl, {
                    timestamp: Date.now(),
                    dateLabel: dateLabel || todayStr(),
                    assignments: [{ id: dailyAsg.id, name: dailyAsg.name, subjectName: dSubj?dSubj.name:'', needsSign: true }],
                    records: snapshotRecords,
                    studentCount: st.students.length,
                    assignmentCount: 1
                }).catch(e=>console.warn(e));
                // 不刪除任何資料——只是強制換成新的一輪（新 ID），今天這份從「目前」移除，
                // 明天（或下次打開）看到的聯絡簿是全新一份，跟一般作業封存後的行為一致。
                st.assignments = st.assignments.filter(a => a.name !== '聯絡簿每日任務');
                st.assignments.push({ id: `daily-聯絡簿每日任務-${crypto.randomUUID()}`, name: '聯絡簿每日任務', subjectId: dailyAsg.subjectId, needsSign: true });
                saveSettings({ assignments: st.assignments });
                window.showAlert('已封存今天的聯絡簿紀錄，換成新的一輪');
            };

            renderGroups();
            renderRecordsTab(records, settings);
            renderGradingTab(gradingRecords, records, settings);
            renderContactTab(records, gradingRecords, st);
            editorReady = true;
        }
        /* 可用 API：clearAll(excludeIds) / saveSettings(obj) / submitGroupRecords(items) / adminSetStatus(item) / adminSetGrading(item) */
        /* ================================================== */
    </script>
</body>
</html>
