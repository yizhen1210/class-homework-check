                    if(currentIds.has(g.assignmentId) || !g.assignmentName || knownPast[g.assignmentId]) return;
                    const m = g.assignmentId.match(/^daily-.+-(\d{4})-(\d{2})-(\d{2})$/);
                    if(g.assignmentName === '聯絡簿每日任務'){
                        knownPast[g.assignmentId] = { name: g.assignmentName, dateLabel: m ? `${m[1]}/${m[2]}/${m[3]}` : '', subjectName: '聯絡簿', signOnly: true };
                    } else {
                        knownPast[g.assignmentId] = { name: g.assignmentName, dateLabel: '', subjectName: '未分類' };
                    }
                });
                Object.assign(knownPast, window.__extraPastAssignments || {});
                const pastOptions = Object.entries(knownPast);

                const selSubj = $('pastSubjectSelect');
                const selPast = $('pastAssignmentSelect');
                const bySubject = {};
                pastOptions.forEach(([id,info]) => { (bySubject[info.subjectName||'未分類'] = bySubject[info.subjectName||'未分類'] || []).push([id,info]); });

                function refreshPastAssignmentOptions(){
                    const curPastSel = selPast.value;
                    const subjName = selSubj.value;
                    const opts = subjName ? (bySubject[subjName] || []).filter(([id,info]) => !info.signOnly) : [];
                    selPast.innerHTML = '<option value="">請選擇作業</option>' + opts.map(([id,info])=>`<option value="${id}">${info.dateLabel ? info.dateLabel+' ' : ''}${info.name}</option>`).join('');
                    selPast.value = opts.some(([id])=>id===curPastSel) ? curPastSel : '';
                }
                if(selSubj){
                    const curSubjSel = selSubj.value;
                    selSubj.innerHTML = '<option value="">請先選擇科目</option>' + Object.keys(bySubject).map(subjName=>`<option value="${subjName}">${subjName}</option>`).join('');
                    selSubj.value = Object.keys(bySubject).includes(curSubjSel) ? curSubjSel : '';
                    selSubj.onchange = () => { refreshPastAssignmentOptions(); renderPastAssignmentGrader(); };
                    refreshPastAssignmentOptions();
                }

                function renderPastAssignmentGrader(){
                    const aid = selPast.value;
                    const box = $('pastAssignmentGradeList');
                    if(!aid){ box.innerHTML = ''; return; }
                    const aName = knownPast[aid] ? knownPast[aid].name : '';
                    const isPastDaily = aName === '聯絡簿每日任務';
                    const gradeOfPast = sid => gradingRecs.find(x=>x.studentId===sid && x.assignmentId===aid);
                    const pastSubjName = knownPast[aid] ? (knownPast[aid].subjectName||'') : '';
                    const dSubj = isPastDaily ? st.subjects.find(x=>x.id===(st.assignments.find(a==='聯絡簿每日任務')||{}).subjectId) : st.subjects.find(x=>x.name===pastSubjName);
                    const pastInfo = knownPast[aid];
                    const archiveDoc = window.__archiveDocsMap ? window.__archiveDocsMap[aid] : null;
                    const foundAsg = archiveDoc ? (archiveDoc.assignments||[]).find(a=>a.id===aid) : null;
                    const pastNeedsSign = !!(
                        (foundAsg && (foundAsg.needsSign || foundAsg.signOnly)) ||
                        (pastInfo && (pastInfo.needsSign || pastInfo.signOnly)) ||
                        isPastDaily ||
                        records.some(r => r.assignmentId === aid && r.signStatus && r.signStatus !== '未簽名') ||
                        (archiveDoc && (archiveDoc.records || []).some(r => r.assignmentId === aid && r.signStatus && r.signStatus !== '未簽名'))
                    );
                    const isExam = isExamAssignment(aName);
                    const isContact = aName === '聯絡簿每日任務';
                    const pastNeedsPoints = !isExam && !isContact;
                    box.innerHTML = sortBySeat(st.students).map(s => {
                        if(isPulledOut(s, pastSubjName)) return `<div class="daily-row ${pastNeedsSign?'':'no-sign'} ${pastNeedsPoints?'has-points':''}" style="grid-template-columns: minmax(70px, 1fr) 140px ${pastNeedsSign?'140px ':''}38px 38px 76px 38px ${pastNeedsPoints?'100px':''}">
                            <span class="student-name">${s.name}</span>
                            <span class="row-slot-pill"><span class="pulled-out-pill">抽離</span></span>
                            ${pastNeedsSign ? `<span class="row-slot-pill"></span>` : ''}
                            <span class="row-slot-icon"></span>
                            <span class="row-slot-icon"></span>
                            <span class="row-slot-corrected"><button type="button" class="corrected-btn" style="visibility:hidden;pointer-events:none">訂正</button></span>
                            <span class="row-slot-icon"></span>
                            ${pastNeedsPoints ? `<span class="row-slot-points"></span>` : ''}
                        </div>`;
                        const g = gradeOfPast(s.id);
                        const cur = g ? g.correctness : '';
                        const thirdVal = isPastDaily ? '沒寫任務' : '遺失';
                        const thirdIcon = isPastDaily ? '－' : '✗';
                        const rec = records.find(r=>r.studentId===s.id && r.assignmentId===aid);
                        const dStatus = rec ? rec.status : '未繳';
                        const dSign = (rec && rec.signStatus) ? rec.signStatus : '未簽名';
                        const dSignDisplay = dSign === '未簽名' ? '未簽' : dSign;
                        const isSigned = dSign === '已簽名';
                        const showCorrected = cur==='有錯';
                        const statusBtn = `<button type="button" class="cell-status-btn ${badgeClass(dStatus)}" data-past-status-toggle>${dStatus}</button>`;
                        const isExamOrTest = aName.includes('卷') || aName.includes('考') || aName.includes('聽') || aName.includes('測驗');
                        const showSign = pastNeedsSign && (isExamOrTest || dStatus === '已繳');
                        const signBtn = pastNeedsSign ? `<button type="button" class="cell-status-btn cell-sign-btn ${signClass(dSign)}" data-past-sign-toggle style="visibility:${showSign?'visible':'hidden'};pointer-events:${showSign?'auto':'none'}">${dSignDisplay}</button>` : '';
                        const makeupSignBtn = (pastNeedsSign && !isSigned && showSign) ? `<button class="btn small outline" data-past-makeup-sign="1">補簽</button>` : '';
                        const correctedBtn = `<button type="button" class="corrected-btn ${g&&g.corrected?'active':''}" data-past-corrected="1" style="visibility:${showCorrected?'visible':'hidden'};pointer-events:${showCorrected?'auto':'none'}">${g&&g.corrected?'✓訂正':'訂正'}</button>`;
                        const makeupBtn = (dStatus !== '已繳') ? `<button class="btn small outline" data-past-makeup="1">補交</button>` : '';
                        const pointsSlot = pastNeedsPoints ? `<span class="row-slot-points">${pointsOf(g, st)>0 ? (g.pointsGiven?'已加點':'尚未加點') : ''}</span>` : '';
                        return `<div class="daily-row ${pastNeedsSign?'':'no-sign'} ${pastNeedsPoints?'has-points':''}" style="grid-template-columns: minmax(70px, 1fr) 140px ${pastNeedsSign?'140px ':''}38px 38px 76px 38px ${pastNeedsPoints?'100px':''}" data-past-student="${s.id}">
                            <span class="student-name">${s.name}</span>
                            <span class="row-slot-pill"><div style="display:flex;gap:6px;align-items:center;justify-content:center;width:100%">${statusBtn}${makeupBtn}</div></span>
                            ${pastNeedsSign ? `<span class="row-slot-pill"><div style="display:flex;gap:6px;align-items:center;justify-content:center;width:100%">${signBtn}${makeupSignBtn}</div></span>` : ''}
                            <span class="row-slot-icon"><button type="button" class="grade-btn ${cur==='全對'?'active g-ok':''}" data-past-grade="全對" title="全對">✓</button></span>
                            <span class="row-slot-icon"><button type="button" class="grade-btn ${cur==='有錯'?'active g-err':''}" data-past-grade="有錯" title="有錯">▲</button></span>
                            <span class="row-slot-corrected">${correctedBtn}</span>
                            <span class="row-slot-icon"><button type="button" class="grade-btn ${cur===thirdVal?'active g-lost':''}" data-past-grade="${thirdVal}" title="${thirdVal}">${thirdIcon}</button></span>
                            ${pointsSlot}
                        </div>`;
                    }).join('');
                    box.querySelectorAll('[data-past-status-toggle]').forEach(btn => btn.onclick = async () => {
                        const row = btn.closest('.daily-row');
                        const sid = row.getAttribute('data-past-student');
                        const stu = st.students.find(x=>x.id===sid);
                        const grp = st.groups.find(x=>x.id===stu?.groupId);
                        const cur2 = records.find(r=>r.studentId===sid && r.assignmentId===aid);
                        const nv = (cur2 && cur2.status === '已繳') ? '未繳' : '已繳';
                        const timeStr = new Date().toLocaleString('zh-TW', { hour12: false });
                        const remarkText = nv === '已繳' ? `已補交（${timeStr}）` : (cur2 ? cur2.remark : '');
                        const payload = {
                            groupId: grp?grp.id:'', groupName: grp?grp.name:'',
                            studentId: sid, studentName: stu?stu.name:'',
                            subjectId: dSubj?dSubj.id:'', subjectName: dSubj?dSubj.name:'',
                            assignmentId: aid, assignmentName: aName,
                            status: nv,
                            remark: remarkText
                        };
                        await adminSetStatus(payload);
                        let r = records.find(r=>r.studentId===sid && r.assignmentId===aid);
                        if(r) Object.assign(r, payload); else records.push(payload);
                        renderPastAssignmentGrader();
                    });
                    box.querySelectorAll('[data-past-makeup]').forEach(btn => btn.onclick = async () => {
                        const row = btn.closest('.daily-row');
                        const sid = row.getAttribute('data-past-student');
                        const stu = st.students.find(x=>x.id===sid);
                        const grp = st.groups.find(x=>x.id===stu?.groupId);
                        const timeStr = new Date().toLocaleString('zh-TW', { hour12: false });
                        const payload = {
                            groupId: grp?grp.id:'', groupName: grp?grp.name:'',
                            studentId: sid, studentName: stu?stu.name:'',
                            subjectId: dSubj?dSubj.id:'', subjectName: dSubj?dSubj.name:'',
                            assignmentId: aid, assignmentName: aName,
                            status: '已繳',
                            remark: `已補交（${timeStr}）`
                        };
                        await adminSetStatus(payload);
                        let r = records.find(r=>r.studentId===sid && r.assignmentId===aid);
                        if(r) Object.assign(r, payload); else records.push(payload);
                        renderPastAssignmentGrader();
                    });
                    box.querySelectorAll('[data-past-sign-toggle]').forEach(btn => btn.onclick = async () => {
                        const row = btn.closest('.daily-row');
                        const sid = row.getAttribute('data-past-student');
                        const stu = st.students.find(x=>x.id===sid);
                        const grp = st.groups.find(x=>x.id===stu?.groupId);
                        const cur2 = records.find(r=>r.studentId===sid && r.assignmentId===aid);
                        const curText = btn.textContent.trim();
                        const nv = (curText === '已簽名' || curText === '已簽') ? '未簽名' : '已簽名';
                        const timeStr = new Date().toLocaleString('zh-TW', { hour12: false });
                        const remarkText = nv === '已簽名' ? (cur2 && cur2.remark ? `${cur2.remark} / 補簽（${timeStr}）` : `已補簽（${timeStr}）`) : (cur2 ? cur2.remark : '');
                        await adminSetStatus({
                            groupId: grp?grp.id:'', groupName: grp?grp.name:'',
                            studentId: sid, studentName: stu?stu.name:'',
                            subjectId: dSubj?dSubj.id:'', subjectName: dSubj?dSubj.name:'',
                            assignmentId: aid, assignmentName: aName,
                            signStatus: nv,
                            remark: remarkText
                        });
                        let r = records.find(r=>r.studentId===sid && r.assignmentId===aid);
                        if(r) { r.signStatus = nv; r.remark = remarkText; }
                        renderPastAssignmentGrader();
                    });
                    box.querySelectorAll('[data-past-makeup-sign]').forEach(btn => btn.onclick = async () => {
                        const row = btn.closest('.daily-row');
                        const sid = row.getAttribute('data-past-student');
                        const stu = st.students.find(x=>x.id===sid);
                        const grp = st.groups.find(x=>x.id===stu?.groupId);
                        const timeStr = new Date().toLocaleString('zh-TW', { hour12: false });
                        const cur2 = records.find(r=>r.studentId===sid && r.assignmentId===aid);
                        const remarkText = cur2 && cur2.remark ? `${cur2.remark} / 補簽（${timeStr}）` : `已補簽（${timeStr}）`;
                        await adminSetStatus({
                            groupId: grp?grp.id:'', groupName: grp?grp.name:'',
                            studentId: sid, studentName: stu?stu.name:'',
                            subjectId: dSubj?dSubj.id:'', subjectName: dSubj?dSubj.name:'',
                            assignmentId: aid, assignmentName: aName,
                            status: cur2 ? cur2.status : '已繳',
                            signStatus: '已簽名',
                            remark: remarkText
                        });
                        let r = records.find(r=>r.studentId===sid && r.assignmentId===aid);
                        if(r) { r.signStatus = '已簽名'; r.remark = remarkText; }
                        renderPastAssignmentGrader();
                    });
                    box.querySelectorAll('[data-past-grade]').forEach(btn => btn.onclick = async () => {
                        const row = btn.closest('.daily-row');
                        const sid = row.getAttribute('data-past-student');
                        const stu = st.students.find(x=>x.id===sid);
                        const val = btn.getAttribute('data-past-grade');
                        const g = gradeOfPast(sid);
                        const nextVal = (g && g.correctness === val) ? '' : val;
                        await adminSetGrading({
                            studentId: sid, studentName: stu?stu.name:'',
                            assignmentId: aid, assignmentName: aName,
                            correctness: nextVal,
                            corrected: nextVal === '有錯' ? (g?g.corrected:false) : false
                        });
                    });
                    box.querySelectorAll('[data-past-corrected]').forEach(btn => btn.onclick = async () => {
                        const row = btn.closest('.daily-row');
                        const sid = row.getAttribute('data-past-student');
                        const stu = st.students.find(x=>x.id===sid);
                        const g = gradeOfPast(sid);
                        await adminSetGrading({
                            studentId: sid, studentName: stu?stu.name:'',
                            assignmentId: aid, assignmentName: aName,
                            correctness: '有錯',
                            corrected: !(g && g.corrected)
                        });
                    });
                }
                if(selPast){ selPast.onchange = renderPastAssignmentGrader; renderPastAssignmentGrader(); }

                $('loadPastArchivesBtn').onclick = autoLoadArchives;
                $('deleteSelectedPastBtn').onclick = async () => {
                    const aid = selPast.value;
                    if(!aid){ window.showAlert('請先在上面選一筆要刪除的作業'); return; }
                    const info = knownPast[aid];
                    const label = info ? `${info.dateLabel ? info.dateLabel+' ' : ''}${info.name}` : aid;
                    const ok2 = await window.askConfirm(`確定要刪除「${label}」這筆紀錄嗎？裡面的訂正與繳交資料都會刪除，無法復原。`);
                    if(!ok2) return;
                    await clearGradingForAssignment(aid);
                    await clearRecordsForAssignment(aid);
                    if(window.__extraPastAssignments) delete window.__extraPastAssignments[aid];
                    window.showAlert(`已刪除「${label}」`);
                };
            }

            // Global buttons handler at the top of tabGrading in exact order: 未繳清單、未訂正清單、未簽名清單、遺失作業清單
            const globalMissingBtn = $('globalMissingListBtn');
            const globalUncorrectedBtn = $('globalUncorrectedListBtn');
            const globalUnsignedBtn = $('globalUnsignedListBtn');
            const globalLostBtn = $('globalLostListBtn');

            if(globalMissingBtn){
                globalMissingBtn.onclick = () => {
                    $('missingListTitle').textContent = '未繳清單';
                    const allAssignmentsMap = {};
                    st.assignments.filter(a => a.name !== '聯絡簿每日任務').forEach(a => {
                        allAssignmentsMap[a.id] = { name: a.name, subjectName: subjNameOf(a) };
                    });
                    if(window.__extraPastAssignments){
                        Object.entries(window.__extraPastAssignments).forEach(([id, info]) => {
                            if(!allAssignmentsMap[id]) allAssignmentsMap[id] = { name: info.name, subjectName: info.subjectName };
                        });
                    }
                    const activeAssIds = new Set(st.assignments.map(a=>a.id));
                    const blocks = Object.entries(allAssignmentsMap).map(([id, info]) => {
                        const hasGrading = gradingRecs.some(g => g.assignmentId === id);
                        const hasRecord = records.some(r => r.assignmentId === id);
                        const archiveDoc = window.__archiveDocsMap ? window.__archiveDocsMap[id] : null;
                        if(!hasGrading && !hasRecord && !activeAssIds.has(id) && !archiveDoc) return '';
                        
                        const applicable = sortBySeat(st.students).filter(s => !isPulledOut(s, info.subjectName));
                        const missing = applicable.filter(s => {
                            const g = gradingRecs.find(x => x.studentId === s.id && x.assignmentId === id);
                            if(g && (g.correctness === '遺失' || g.correctness === '沒寫任務')) return false;
                            const rec = records.find(r => r.studentId === s.id && r.assignmentId === id);
                            const archRec = archiveDoc && (archiveDoc.records||[]).find(r => r.studentId === s.id && r.assignmentId === id);
                            const status = rec ? rec.status : (archRec ? archRec.status : '未繳');
                            return status !== '已繳';
                        });
                        if(!missing.length) return '';
                        return `<p style="margin-bottom:4px"><strong>${info.name}</strong>：${missing.map(s=>s.name).join('、')}</p>`;
                    }).filter(Boolean);
                    $('missingListBody').innerHTML = blocks.length ? blocks.join('') : '<p class="empty-hint">目前沒有未繳項目</p>';
                    $('missingListModal').style.display = 'flex';
                };
            }
            if(globalUncorrectedBtn){
                globalUncorrectedBtn.onclick = () => {
                    $('missingListTitle').textContent = '未訂正清單';
                    const allAssignmentsMap = {};
                    st.assignments.filter(a => a.name !== '聯絡簿每日任務' && !a.signOnly).forEach(a => {
                        allAssignmentsMap[a.id] = { name: a.name, subjectName: subjNameOf(a) };
                    });
                    if(window.__extraPastAssignments){
                        Object.entries(window.__extraPastAssignments).forEach(([id, info]) => {
                            if(!info.signOnly && !allAssignmentsMap[id]) allAssignmentsMap[id] = { name: info.name, subjectName: info.subjectName };
                        });
                    }
                    const blocks = Object.entries(allAssignmentsMap).map(([id, info]) => {
                        const hasAnyGrading = gradingRecs.some(g => g.assignmentId === id) || (window.__archiveDocsMap && window.__archiveDocsMap[id]);
                        if(!hasAnyGrading) return '';
                        const uncorrected = sortBySeat(st.students).filter(s => {
                            if(isPulledOut(s, info.subjectName)) return false;
                            const g = gradingRecs.find(x => x.studentId === s.id && x.assignmentId === id);
                            return g && g.correctness === '有錯' && !g.corrected;
                        });
                        if(!uncorrected.length) return '';
                        return `<p style="margin-bottom:4px"><strong>${info.name}</strong>：${uncorrected.map(s=>s.name).join('、')}</p>`;
                    }).filter(Boolean);
                    $('missingListBody').innerHTML = blocks.length ? blocks.join('') : '<p class="empty-hint">目前沒有未訂正項目</p>';
                    $('missingListModal').style.display = 'flex';
                };
            }
            if(globalUnsignedBtn){
                globalUnsignedBtn.onclick = () => {
                    $('missingListTitle').textContent = '未簽名清單';
                    const allAssignmentsMap = {};
                    st.assignments.filter(a => a.name !== '聯絡簿每日任務' && (a.needsSign || a.signOnly)).forEach(a => {
                        allAssignmentsMap[a.id] = { name: a.name, subjectName: subjNameOf(a), signOnly: !!a.signOnly };
                    });
                    if(window.__extraPastAssignments){
                        Object.entries(window.__extraPastAssignments).forEach(([id, info]) => {
                            if((info.needsSign || info.signOnly) && !allAssignmentsMap[id]) allAssignmentsMap[id] = { name: info.name, subjectName: info.subjectName, signOnly: !!info.signOnly };
                        });
                    }
                    const blocks = Object.entries(allAssignmentsMap).map(([id, info]) => {
                        const applicable = sortBySeat(st.students).filter(s => !isPulledOut(s, info.subjectName));
                        const unsigned = applicable.filter(s => {
                            const rec = records.find(r => r.studentId === s.id && r.assignmentId === id);
                            const archDoc = window.__archiveDocsMap ? window.__archiveDocsMap[id] : null;
                            const archRec = archDoc && (archDoc.records||[]).find(r => r.studentId === s.id && r.assignmentId === id);
                            const status = rec ? rec.status : (archRec ? archRec.status : '未繳');
                            const signStatus = rec ? rec.signStatus : (archRec ? archRec.signStatus : '未簽名');

                await addDoc(pointLogsColl, {

                }).catch(e=>console.warn(e));

        function todayISODate(){
            const d = new Date();
            return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
        }
        const DAILY_FIXED_ASSIGNMENTS = [
            { name: '聯絡簿每日任務', needsSign: true }
        ];
        function isSchoolDay(dateStr, st){
            const sem = st.semester || {};
            if(sem.skipWeekends !== false){
                const day = new Date(dateStr + 'T00:00:00').getDay();
                if(day === 0 || day === 6) return false;
            }
            if(sem.startDate && dateStr < sem.startDate) return false;
            if(sem.endDate && dateStr > sem.endDate) return false;
            if(sem.holidays && sem.holidays.includes(dateStr)) return false;
            return true;
        }
        function ensureDailyAssignments(st){
            let changed = false;
            let contactSubj = st.subjects.find(s => s.name === '聯絡簿');
            if(!contactSubj){
                contactSubj = { id: crypto.randomUUID(), name: '聯絡簿', isSystem: true };
                st.subjects = [...st.subjects, contactSubj];
                changed = true;
            }
            const today = todayISODate();
            const schoolDay = isSchoolDay(today, st);
            DAILY_FIXED_ASSIGNMENTS.forEach(fixed => {
                const existing = st.assignments.find(a => a.name === fixed.name);
                if(!existing){
                    st.assignments.push({ id: `daily-${fixed.name}-${today}`, name: fixed.name, subjectId: contactSubj.id, needsSign: fixed.needsSign });
                    changed = true;
                    return;
                }
                if(!schoolDay) return;
                const todayId = `daily-${fixed.name}-${today}`;
                if(existing.id !== todayId){
                    st.assignments = st.assignments.filter(a => a.name !== fixed.name);
                    st.assignments.push({ id: todayId, name: fixed.name, subjectId: contactSubj.id, needsSign: fixed.needsSign });
                    changed = true;
                }
            });
            if(changed) saveSettings({ assignments: st.assignments, subjects: st.subjects });
        }

                            };
                            if(r.signStatus) payload.signStatus = r.signStatus;
                            recBatch.set(ref, payload, { merge: true });
                            if(r.correctness !== undefined){
                                const gref = doc(gradingColl, recordDocId(r.studentId, r.assignmentId));
                                gradeBatch.set(gref, {
                                    studentId: r.studentId, studentName: r.studentName,
                                    assignmentId: r.assignmentId, assignmentName: r.assignmentName,
                                    correctness: r.correctness || '', corrected: !!r.corrected,
                                    updatedAt: Date.now()
                                }, { merge: true });
                            }
                        });
                        await recBatch.commit().catch(e=>console.warn(e));
                        await gradeBatch.commit().catch(e=>console.warn(e));
                        window.showAlert(`已還原「${label}」`);
                    });
                    archivesListEl.querySelectorAll('[data-del-archive]').forEach(b => b.onclick = async () => {
                        const aid = b.getAttribute('data-del-archive');
                        const item = list.find(x=>x.id===aid);
                        const label = item ? (item.dateLabel || new Date(item.timestamp).toLocaleDateString('zh-TW')) : '';
                        const ok2 = await window.askConfirm(`確定刪除「${label}」嗎？`);
                        if(!ok2) return;
                        await deleteDoc(doc(db, 'archives', aid)).catch(e=>{ console.warn(e); window.showAlert('刪除失敗'); });
                        const idsToClean = (item && item.assignments) ? item.assignments.map(a=>a.id) : [];
                        for(const gid of idsToClean){
                            await clearGradingForAssignment(gid);
                            await clearRecordsForAssignment(gid);
                            if(window.__extraPastAssignments) delete window.__extraPastAssignments[gid];
                        }
                        renderArchivesList();
                    });
                } catch(e){ console.warn(e); archivesListEl.innerHTML = '<p class="empty-hint">載入失敗</p>'; }
            }
            renderArchivesList();

            function renderGroups(){
                $('groupsList').innerHTML = st.groups.map(g => `
                    <div class="group-block" data-group="${g.id}">
                        <div class="group-block-head">
                            <strong>${g.name}</strong>
                            <button class="btn small outline danger" data-del-group="${g.id}">刪除組別</button>
                        </div>
                        <div class="chip-list">
                            ${sortBySeat(st.students.filter(s=>s.groupId===g.id)).map(s => `<span class="chip">${s.seat!=null && s.seat!=='' ? s.seat+'號 ' : ''}${s.name}${s.pullout && (s.pullout.chinese||s.pullout.math) ? `<span class="sign-tag" style="color:#b8860c">${pulloutLabel(s.pullout)}</span>` : ''}<button data-pullout-student="${s.id}" title="設定抽離上課" style="color:#b8860c">抽</button><button data-move-student="${s.id}" title="搬到其他組別" style="color:var(--accent)">⇄</button><button data-del-student="${s.id}">✕</button></span>`).join('') || '<span style="color:var(--muted)">尚無學生</span>'}
                        </div>
                        <div class="row inline-add-row" style="margin-bottom:0">
                            <input class="txt-input" data-new-student="${g.id}" placeholder="新增學生姓名">
                            <button class="btn" data-add-student="${g.id}">新增</button>
                        </div>
                    </div>`).join('') || '<p class="empty-hint">尚未新增組別</p>';

                $('groupsList').querySelectorAll('[data-del-group]').forEach(b => b.onclick = () => {
                    resyncFromGlobal();
                    const gid = b.getAttribute('data-del-group');
                    st.groups = st.groups.filter(g=>g.id!==gid);
                    st.students = st.students.filter(s=>s.groupId!==gid);
                    saveSettings({ groups: st.groups, students: st.students });
                    renderGroups();
                });
                $('groupsList').querySelectorAll('[data-del-student]').forEach(b => b.onclick = () => {
                    resyncFromGlobal();
                    const sid = b.getAttribute('data-del-student');
                    st.students = st.students.filter(s=>s.id!==sid);
                    saveSettings({ students: st.students });
                    renderGroups();
                });
                $('groupsList').querySelectorAll('[data-move-student]').forEach(b => b.onclick = async () => {
                    resyncFromGlobal();
                    const sid = b.getAttribute('data-move-student');
                    const stu = st.students.find(x=>x.id===sid);
                    if(!stu) return;
                    const curGroup = st.groups.find(g=>g.id===stu.groupId);
                    const otherGroups = st.groups.filter(g=>g.id!==stu.groupId);
                    if(!otherGroups.length){ window.showAlert('目前沒有其他組別可以搬'); return; }
                    const targetName = await window.askChoice(`「${stu.name}」目前在「${curGroup?curGroup.name:''}」，要搬到哪一組？`, otherGroups.map(g=>g.name));
                    if(!targetName) return;
                    const targetGroup = st.groups.find(g => g.name === targetName);
                    if(!targetGroup) return;
                    resyncFromGlobal();
                    const freshStu = st.students.find(x=>x.id===sid);
                    if(freshStu) freshStu.groupId = targetGroup.id;
                    saveSettings({ students: st.students });
                    renderGroups();
                });
                $('groupsList').querySelectorAll('[data-pullout-student]').forEach(b => b.onclick = () => {
                    resyncFromGlobal();
                    const sid = b.getAttribute('data-pullout-student');
                    const stu = st.students.find(x=>x.id===sid);
                    if(!stu) return;
                    stu.pullout = nextPullout(stu.pullout);
                    saveSettings({ students: st.students });
                    renderGroups();
                });
                $('groupsList').querySelectorAll('[data-add-student]').forEach(b => b.onclick = () => {
                    resyncFromGlobal();
                    const gid = b.getAttribute('data-add-student');
                    const nameInp = $('groupsList').querySelector(`[data-new-student="${gid}"]`);
                    const name = nameInp.value.trim();
                    if(!name) return;
                    st.students.push({ id: crypto.randomUUID(), name, groupId: gid });
                    saveSettings({ students: st.students });
                    renderGroups();
                });
            }

            $('addGroupBtn').onclick = () => {
                resyncFromGlobal();
                const name = $('newGroupName').value.trim();
                if(!name) return;
                st.groups.push({ id: crypto.randomUUID(), name });
                saveSettings({ groups: st.groups });
                $('newGroupName').value = '';
                renderGroups();
            };

            $('toggleGradeMatrixBtn').onclick = () => {
                const body = $('gradeMatrixBody');
                const show = body.style.display === 'none';
                body.style.display = show ? 'block' : 'none';
                $('toggleGradeMatrixBtn').textContent = show ? '收合' : '展開';
            };
            $('toggleArchivedGradingBtn').onclick = () => {
                const body = $('archivedGradingBody');
                const show = body.style.display === 'none';
                body.style.display = show ? 'block' : 'none';
                $('toggleArchivedGradingBtn').textContent = show ? '收合' : '展開';
            };
            $('contactViewSeatBtn').onclick = () => { contactViewMode = 'seat'; renderContactTab(records, gradingRecords, st); };
            $('contactViewGroupBtn').onclick = () => { contactViewMode = 'group'; renderContactTab(records, gradingRecords, st); };
            $('archiveContactBtn').onclick = async () => {
                const dailyAsg = st.assignments.find(a => a.name === '聯絡簿每日任務');
                if(!dailyAsg){ window.showAlert('目前沒有「聯絡簿每日任務」這項作業'); return; }
                const dateLabel = await window.askInput('這筆聯絡簿封存要標記的日期', todayStr());
                if(dateLabel === null) return;
                const ok2 = await window.askConfirm('確定要封存今天的聯絡簿紀錄嗎？');
                if(!ok2) return;
                const dSubj = st.subjects.find(x=>x.id===dailyAsg.subjectId);
                const students2 = sortBySeat(st.students);
                const snapshotRecords = students2.map(s => {
                    const rec = records.find(r=>r.studentId===s.id && r.assignmentId===dailyAsg.id);
                    const g = gradingRecords.find(x=>x.studentId===s.id && x.assignmentId===dailyAsg.id);
                    return {
                        studentId: s.id, studentName: s.name,
                        assignmentId: dailyAsg.id, assignmentName: dailyAsg.name,
                        status: rec?rec.status:'未繳',
                        signStatus: rec?rec.signStatus:'未簽名',
                        correctness: g?g.correctness:'',
                        corrected: g?g.corrected:false,
                        pulledOut: isPulledOut(s, dSubj?dSubj.name:'')
                    };
                });
                await addDoc(archivesColl, {
                    timestamp: Date.now(),
                    dateLabel: dateLabel || todayStr(),
                    assignments: [{ id: dailyAsg.id, name: dailyAsg.name, subjectName: dSubj?dSubj.name:'', needsSign: true }],
                    records: snapshotRecords,
                    studentCount: st.students.length,
                    assignmentCount: 1
                }).catch(e=>console.warn(e));
                st.assignments = st.assignments.filter(a => a.name !== '聯絡簿每日任務');
                st.assignments.push({ id: `daily-聯絡簿每日任務-${crypto.randomUUID()}`, name: '聯絡簿每日任務', subjectId: dailyAsg.subjectId, needsSign: true });
                saveSettings({ assignments: st.assignments });
                window.showAlert('已封存今天的聯絡簿紀錄，換成新的一輪');
                autoLoadArchives();
            };

            renderGroups();
            renderRecordsTab(records, settings);
            renderGradingTab(gradingRecords, records, st);
            renderContactTab(gradingRecords, records, st);
            editorReady = true;
        }
    </script>
</body>
</html>
