                        }
                        renderPastAssignmentGrader();
                        await adminSetGrading(payload);
                        const targetDocId = archiveDoc ? (archiveDoc._id || archiveDoc.id) : null;
                        if (archiveDoc && targetDocId) {
                            archiveDoc.records = sanitizeArchiveRecords(archiveDoc.records);
                            if (window.__archiveDocsMap) {
                                if (window.__archiveDocsMap[targetDocId]) window.__archiveDocsMap[targetDocId].records = archiveDoc.records;
                                if (window.__archiveDocsMap[aid]) window.__archiveDocsMap[aid].records = archiveDoc.records;
                                if (window.__archiveDocsMap[rawSel]) window.__archiveDocsMap[rawSel].records = archiveDoc.records;
                            }
                            if (window.__refreshOpenArchiveDetail && targetDocId) {
                                window.__refreshOpenArchiveDetail(targetDocId);
                            }
                            await setDoc(doc(db, 'archives', targetDocId), { records: archiveDoc.records }, { merge: true }).catch(e=>console.warn(e));
                        }
                    });
                }
                if(selPast){ selPast.onchange = renderPastAssignmentGrader; renderPastAssignmentGrader(); }

                $('loadPastArchivesBtn').onclick = async () => {
                    await autoLoadArchives();
                    renderPastAssignmentGrader();
                };
                const renamePastBtn = $('renameSelectedPastBtn');
                if (renamePastBtn) {
                    renamePastBtn.onclick = async () => {
                        const rawSel = selPast.value;
                        if (!rawSel) { window.showAlert('請先在上面選一筆要重新命名的作業'); return; }
                        const [targetDocId, targetAid] = rawSel.includes('::') ? rawSel.split('::') : ['', rawSel];
                        const info = knownPast[rawSel] || knownPast[targetAid];
                        const currentName = info ? info.name : '';
                        const label = info ? `${info.dateLabel ? info.dateLabel + ' ' : ''}${info.name}` : targetAid;
                        const newName = await window.askInput(`請輸入「${label}」的新作業名稱：`, currentName);
                        if (newName === null) return;
                        let trimmed = newName.trim();
                        if (!trimmed) { window.showAlert('作業名稱不可為空白'); return; }
                        // 若使用者輸入了帶有日期的名稱且與 dateLabel 重複，去除重複前綴避免顯示變成 2026/09/14 2026/09/14 ...
                        if (info && info.dateLabel && trimmed.startsWith(info.dateLabel)) {
                            trimmed = trimmed.replace(info.dateLabel, '').trim();
                        }
                        if (trimmed === currentName) return;

                        try {
                            // 1. 更新 Firestore archives 中的 assignment 與 records
                            const snap = await getDocs(archivesColl);
                            for (const d of snap.docs) {
                                if (targetDocId && d.id !== targetDocId) continue;
                                const data = d.data();
                                let changed = false;
                                (data.assignments || []).forEach(a => {
                                    if (a.id === targetAid) {
                                        a.name = trimmed;
                                        changed = true;
                                    }
                                });
                                if (changed) {
                                    (data.records || []).forEach(r => {
                                        if (r.assignmentId === targetAid) {
                                            r.assignmentName = trimmed;
                                        }
                                    });
                                    await setDoc(doc(db, 'archives', d.id), {
                                        assignments: data.assignments,
                                        records: data.records
                                    }, { merge: true });
                                    if (window.__archiveDocsMap && window.__archiveDocsMap[d.id]) {
                                        window.__archiveDocsMap[d.id].assignments = data.assignments;
                                        window.__archiveDocsMap[d.id].records = data.records;
                                    }
                                }
                            }

                            // 2. 更新 Firestore gradingRecords 集合
                            const gSnap = await getDocs(query(gradingColl, where('assignmentId', '==', targetAid)));
                            if (!gSnap.empty) {
                                const b = writeBatch(db);
                                gSnap.docs.forEach(gd => b.update(gd.ref, { assignmentName: trimmed }));
                                await b.commit();
                            }

                            // 3. 更新當前 settings 中的作業（若有的話）
                            if (settings && Array.isArray(settings.assignments)) {
                                const curA = settings.assignments.find(x => x.id === targetAid);
                                if (curA) {
                                    curA.name = trimmed;
                                    saveSettings({ assignments: settings.assignments });
                                }
                            }

                            // 4. 更新內存狀態
                            if (knownPast[rawSel]) knownPast[rawSel].name = trimmed;
                            if (knownPast[targetAid]) knownPast[targetAid].name = trimmed;
                            if (window.__extraPastAssignments) {
                                if (window.__extraPastAssignments[rawSel]) window.__extraPastAssignments[rawSel].name = trimmed;
                                if (window.__extraPastAssignments[targetAid]) window.__extraPastAssignments[targetAid].name = trimmed;
                            }
                            gradingRecords.forEach(g => {
                                if (g.assignmentId === targetAid) g.assignmentName = trimmed;
                            });

                            // 5. 重新整理畫面
                            refreshPastAssignmentOptions();
                            selPast.value = rawSel;
                            renderPastAssignmentGrader();
                            window.showAlert(`作業名稱已成功修改為：「${trimmed}」`);
                        } catch(e) {
                            console.error(e);
                            window.showAlert('修改作業名稱失敗，請檢查網路後重試');
                        }
                    };
                }
                $('deleteSelectedPastBtn').onclick = async () => {
                    const rawSel = selPast.value;
                    if(!rawSel){ window.showAlert('請先在上面選一筆要刪除的作業'); return; }
                    const [targetDocId, targetAid] = rawSel.includes('::') ? rawSel.split('::') : ['', rawSel];
                    const info = knownPast[rawSel] || knownPast[targetAid];
                    const label = info ? `${info.dateLabel ? info.dateLabel+' ' : ''}${info.name}` : targetAid;
                    const ok2 = await window.askConfirm(`確定要刪除「${label}」這筆紀錄嗎？裡面的訂正與繳交資料都會刪除，無法復原。`);
                    if(!ok2) return;
                    await clearGradingForAssignment(targetAid);
                    await clearRecordsForAssignment(targetAid);
                    if (window.__extraPastAssignments) {
                        delete window.__extraPastAssignments[rawSel];
                        delete window.__extraPastAssignments[targetAid];
                    }
                    delete knownPast[rawSel];
                    delete knownPast[targetAid];
                    refreshPastAssignmentOptions();
                    selPast.value = '';
                    renderPastAssignmentGrader();
                    window.showAlert(`已刪除「${label}」`);
                };
            }

            const globalMissingBtn = $('globalMissingListBtn');
            const globalUncorrectedBtn = $('globalUncorrectedListBtn');
            const globalUnsignedBtn = $('globalUnsignedListBtn');
            const globalLostBtn = $('globalLostListBtn');
            const globalMakeupStatsBtn = $('globalMakeupStatsBtn');

            const isArchivesReady = () => {
                return (window.__archiveDocsList && window.__archiveDocsList.length > 0) || window.__archivesLoaded === true;
            };

            const ensureArchivesReady = async () => {
                if (!isArchivesReady()) {
                    await autoLoadArchives();
                }
            };

            const renderGlobalPopupByType = (type) => {
                const { missingBlocks, uncorrectedBlocks, unsignedBlocks } = computeGlobalPopupLists({
                    settings: st,
                    records,
                    gradingRecords: gradingRecs,
                    archiveDocsList: window.__archiveDocsList,
                    archiveDocsMap: window.__archiveDocsMap,
                    extraPastAssignments: window.__extraPastAssignments
                });
                if (type === 'missing') {
                    $('missingListTitle').textContent = '未繳清單';
                    $('missingListBody').innerHTML = missingBlocks.length
                        ? missingBlocks.map(b => `<p style="margin-bottom:4px"><strong>${escapeHtml(b.displayName)}</strong>：${b.studentNames.map(n => escapeHtml(n)).join('、')}</p>`).join('')
                        : '<p class="empty-hint">目前沒有未繳項目</p>';
                } else if (type === 'uncorrected') {
                    $('missingListTitle').textContent = '未訂正清單';
                    $('missingListBody').innerHTML = uncorrectedBlocks.length
                        ? uncorrectedBlocks.map(b => `<p style="margin-bottom:4px"><strong>${escapeHtml(b.displayName)}</strong>：${b.studentNames.map(n => escapeHtml(n)).join('、')}</p>`).join('')
                        : '<p class="empty-hint">目前沒有未訂正項目</p>';
                } else if (type === 'unsigned') {
                    $('missingListTitle').textContent = '未簽名清單';
                    $('missingListBody').innerHTML = unsignedBlocks.length
                        ? unsignedBlocks.map(b => `<p style="margin-bottom:4px"><strong>${escapeHtml(b.displayName)}</strong>：${b.studentNames.map(n => escapeHtml(n)).join('、')}</p>`).join('')
                        : '<p class="empty-hint">目前沒有未簽名項目</p>';
                }
            };

            const openPopupImmediately = (type, title) => {
                $('missingListTitle').textContent = title;
                renderGlobalPopupByType(type);
                $('missingListModal').style.display = 'flex';
                if (!isArchivesReady()) {
                    ensureArchivesReady().then(() => {
                        if ($('missingListModal') && $('missingListModal').style.display === 'flex' && $('missingListTitle').textContent === title) {
                            renderGlobalPopupByType(type);
                        }
                    });
                }
            };

            if(globalMissingBtn){
                globalMissingBtn.onclick = () => openPopupImmediately('missing', '未繳清單');
            }
            if(globalUncorrectedBtn){
                globalUncorrectedBtn.onclick = () => openPopupImmediately('uncorrected', '未訂正清單');
            }
            if(globalUnsignedBtn){
                globalUnsignedBtn.onclick = () => openPopupImmediately('unsigned', '未簽名清單');
            }
            function renderMissingLostList() {
                $('missingListTitle').textContent = '遺失作業清單';
                const sortedList = resolveLostAssignments(st.students, gradingRecs, window.__archiveDocsMap);
                $('missingListBody').innerHTML = sortedList.length ? sortedList.map(x => `
                    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;padding-bottom:4px;border-bottom:1px solid var(--line)">
                        <span><strong>${escapeHtml(x.name)}</strong>：${x.count} 件</span>
                        <button class="btn small outline" data-lost-detail="${escapeHtml(x.id)}">詳情</button>
                    </div>
                    <div id="lostDetail_${escapeHtml(x.id)}" style="display:none;margin:4px 0 10px 14px;font-size:0.9em;color:var(--muted)">
                        ${x.assignments.map(a => escapeHtml(a)).join('、')}
                    </div>
                `).join('') : '<p class="empty-hint">目前沒有遺失紀錄</p>';
                
                $('missingListBody').querySelectorAll('[data-lost-detail]').forEach(btn => {
                    btn.onclick = () => {
                        const sid = btn.getAttribute('data-lost-detail');
                        const detailEl = document.getElementById(`lostDetail_${sid}`);
                        if(detailEl){
                            detailEl.style.display = detailEl.style.display === 'block' ? 'none' : 'block';
                        }
                    };
                });
            }
            if(globalLostBtn){
                globalLostBtn.onclick = () => {
                    $('missingListTitle').textContent = '遺失作業清單';
                    renderMissingLostList();
                    $('missingListModal').style.display = 'flex';
                    if (!isArchivesReady()) {
                        ensureArchivesReady().then(() => {
                            if ($('missingListModal') && $('missingListModal').style.display === 'flex' && $('missingListTitle').textContent === '遺失作業清單') {
                                renderMissingLostList();
                            }
                        });
                    }
                };
            }
            if(globalMakeupStatsBtn){
                globalMakeupStatsBtn.onclick = () => {
                    openMakeupStatsModal();
                    if (!isArchivesReady()) {
                        ensureArchivesReady().then(() => {
                            if ($('makeupStatsModal') && $('makeupStatsModal').style.display === 'flex') {
                                openMakeupStatsModal();
                            }
                        });
                    }
                };
            }
            if($('missingListModal') && $('missingListModal').style.display === 'flex' && $('missingListTitle')){
                const curTitle = $('missingListTitle').textContent;
                if(curTitle === '遺失作業清單') renderMissingLostList();
                else if(curTitle === '未繳清單') renderGlobalPopupByType('missing');
                else if(curTitle === '未訂正清單') renderGlobalPopupByType('uncorrected');
                else if(curTitle === '未簽名清單') renderGlobalPopupByType('unsigned');
            }

            const thead = $('gradeThead');
            thead.innerHTML = '<tr><th>學生</th>' + assignments.map(a=>`<th>${a.name}</th>`).join('') + '</tr>';
            const tbody = $('gradeTbody');

            const renderGradingRowsContent = () => {
                const getRowHtml = (s, isGroupMode) => {
                    const cellStyle = isGroupMode ? ' style="text-align: center; min-width: 82px; vertical-align: top;"' : '';
                    const firstCellStyle = isGroupMode ? ' style="text-align: left; white-space: nowrap;"' : '';
                    
                    const cells = assignments.map(a => {
                        if(isPulledOut(s, subjNameOf(a))) return `<td${cellStyle}><span class="cell-pulled-out">抽離</span></td>`;
                        const isExempt = /(?:聽考|複[AaＡａ]卷|複[BbＢｂ]卷)/.test(a.name || '');
                        const isSubmitted = statusOf(s.id, a.id) === '已繳';
                        const rec = recs.find(x => x.studentId === s.id && x.assignmentId === a.id);
                        const isLeave = isRecordLeave(rec, null);
                        const leaveTag = isLeave ? '<span class="leave-tag">請假</span>' : '';
                        if(!isSubmitted && !isExempt){
                            return `<td${cellStyle}><div class="cell-stack" style="min-height:70px;justify-content:center;"><span class="grade-missing">缺交</span>${leaveTag}</div></td>`;
                        }

                        const gRecord = gradeOf(s.id, a.id);
                        const cur = gRecord ? gRecord.correctness : '';
                        const showCorrected = cur === '有錯';
                        const isDaily = a.name === '聯絡簿每日任務';
                        const thirdBtn = isDaily
                            ? `<button type="button" class="grade-btn ${cur==='沒寫任務'?'active g-lost':''}" data-grade-student="${s.id}" data-grade-assignment="${a.id}" data-grade-value="沒寫任務" title="沒寫任務">－</button>`
                            : `<button type="button" class="grade-btn ${cur==='遺失'?'active g-lost':''}" data-grade-student="${s.id}" data-grade-assignment="${a.id}" data-grade-value="遺失" title="遺失">✗</button>`;
                        const btns = `
                            <div class="mini-status-group">
                                <button type="button" class="grade-btn ${cur==='全對'?'active g-ok':''}" data-grade-student="${s.id}" data-grade-assignment="${a.id}" data-grade-value="全對" title="全對">✓</button>
                                <button type="button" class="grade-btn ${cur==='有錯'?'active g-err':''}" data-grade-student="${s.id}" data-grade-assignment="${a.id}" data-grade-value="有錯" title="有錯">▲</button>
                                ${thirdBtn}
                            </div>`;
                        const correctedBtn = `<button type="button" class="corrected-btn ${gRecord&&gRecord.corrected?'active':''}" data-corrected-student="${s.id}" data-corrected-assignment="${a.id}" style="visibility:${showCorrected?'visible':'hidden'};pointer-events:${showCorrected?'auto':'none'}">${gRecord&&gRecord.corrected?'✓訂正':'訂正'}</button>`;
                        return `<td${cellStyle}><div class="cell-stack">${btns}<div class="corrected-slot">${correctedBtn}</div>${leaveTag}</div></td>`;
                    }).join('');
                    const anyLeave = assignments.some(a => isRecordLeave(recs.find(x => x.studentId === s.id && x.assignmentId === a.id), null));
                    const studentLeaveBadge = anyLeave ? '<span class="leave-tag" style="margin-left:6px;vertical-align:middle;">請假</span>' : '';
                    return `<tr><td${firstCellStyle}>${s.name}${studentLeaveBadge}</td>${cells}</tr>`;
                };

                if(gradingViewMode === 'group'){
                    const theadHtml = '<tr><th style="text-align: left; white-space: nowrap;">學生</th>' + assignments.map(a=>`<th style="text-align: center; min-width: 82px; vertical-align: top;">${a.name}</th>`).join('') + '</tr>';
                    return st.groups.map(g => {
                        const gStudents = sortBySeat(st.students.filter(s=>s.groupId===g.id));
                        return `<div class="group-block">
                            <div class="group-block-head"><strong>${g.name}</strong></div>
                            <div class="table-scroll">
                                <table>
                                    <thead>${theadHtml}</thead>
                                    <tbody>
                                        ${gStudents.length ? gStudents.map(s => getRowHtml(s, true)).join('') : `<tr><td colspan="${assignments.length + 1}" class="empty-hint">此組別尚無學生</td></tr>`}
                                    </tbody>
                                </table>
                            </div>
                        </div>`;
                    }).join('') || '<p class="empty-hint">尚未新增組別</p>';
                } else {
                    return students.length ? students.map(s => getRowHtml(s, false)).join('') : '';
                }
            };

            const tableWrapContainer = $('gradeMatrixBody').querySelector('.table-scroll');
            let customGroupContainer = $('groupGradingContainer');
            if(!customGroupContainer){
                customGroupContainer = document.createElement('div');
                customGroupContainer.id = 'groupGradingContainer';
                $('gradeMatrixBody').appendChild(customGroupContainer);
            }

            if(gradingViewMode === 'group'){
                if(tableWrapContainer) tableWrapContainer.style.display = 'none';
                customGroupContainer.style.display = 'block';
                customGroupContainer.innerHTML = renderGradingRowsContent();
            } else {
                if(tableWrapContainer) tableWrapContainer.style.display = 'block';
                customGroupContainer.style.display = 'none';
                customGroupContainer.innerHTML = '';
                tbody.innerHTML = renderGradingRowsContent();
            }

            $('gradeEmpty').style.display = students.length && assignments.length ? 'none' : 'block';
            $('gradeEmpty').textContent = !students.length ? '尚未新增學生' : (!assignments.length ? '目前沒有作業' : '');

            document.querySelectorAll('[data-grade-value]').forEach(btn => btn.onclick = async () => {
                const sid = btn.getAttribute('data-grade-student'), aid = btn.getAttribute('data-grade-assignment');
                const val = btn.getAttribute('data-grade-value');
                const stu = st.students.find(x=>x.id===sid);
                const a = st.assignments.find(x=>x.id===aid);
                const g = gradeOf(sid, aid);
                const nextVal = (g && g.correctness === val) ? '' : val;
                const payload = {
                    studentId: sid, studentName: stu?stu.name:'',
                    assignmentId: aid, assignmentName: a?a.name:'',
                    correctness: nextVal,
                    corrected: nextVal === '有錯' ? (g?g.corrected:false) : false
                };
                let existing = gradingRecs.find(x => x.studentId === sid && x.assignmentId === aid);
                if (existing) Object.assign(existing, payload); else gradingRecs.push(payload);
                renderGradingTab(gradingRecs, recs, st);
                await adminSetGrading(payload);
            });
            document.querySelectorAll('[data-corrected-student]').forEach(btn => btn.onclick = async () => {
                const sid = btn.getAttribute('data-corrected-student'), aid = btn.getAttribute('data-corrected-assignment');
                const stu = st.students.find(x=>x.id===sid);
                const a = st.assignments.find(x=>x.id===aid);
                const g = gradeOf(sid, aid);
                const payload = {
                    studentId: sid, studentName: stu?stu.name:'',
                    assignmentId: aid, assignmentName: a?a.name:'',
                    correctness: '有錯',
                    corrected: !(g && g.corrected)
                };
                let existing = gradingRecs.find(x => x.studentId === sid && x.assignmentId === aid);
                if (existing) Object.assign(existing, payload); else gradingRecs.push(payload);
                renderGradingTab(gradingRecs, recs, st);
                await adminSetGrading(payload);
            });

            const sel = $('pointsStudentSelect');
            const curSel = sel.value;
            sel.innerHTML = '<option value="">請選擇學生</option><option value="ALL">全部加點</option>' + students.map(s=>`<option value="${s.id}">${s.name}</option>`).join('');
            sel.value = [...sel.options].some(o=>o.value===curSel) ? curSel : '';

            $('calcPointsBtn').onclick = async () => {
                const sid = sel.value;
                if(!sid){ window.showAlert('請先選擇學生或全部加點'); return; }

                const isAwarded = g => !!(
                    g.pointsGiven ||
                    (window.__awardedPointsSet && window.__awardedPointsSet.has(`${g.studentId}_${g.assignmentId}`))
                );

                // 全部加點模式
                if (sid === 'ALL') {
                    const studentResults = [];
                    let totalPointsAll = 0;
                    const sortedStudents = sortBySeat(st.students);

                    sortedStudents.forEach(stu => {
                        const eligible = gradingRecs.filter(g => {
                            if (g.studentId !== stu.id || isAwarded(g)) return false;
                            const pts = pointsOf(g, st, (window.__extraPastAssignments && window.__extraPastAssignments[g.assignmentId]));
                            return pts > 0;
                        });
                        if (!eligible.length) return;

                        const items = eligible.map(g => ({
                            assignmentId: g.assignmentId,
                            assignmentName: g.assignmentName,
                            type: g.correctness === '全對' ? '全對' : '訂正完成',
                            points: pointsOf(g, st, (window.__extraPastAssignments && window.__extraPastAssignments[g.assignmentId]))
                        }));
                        const total = items.reduce((sum, i) => sum + i.points, 0);
                        const dateLimit = getLatestEligibleAssignmentDate(eligible, st, window.__archiveDocsMap, window.__extraPastAssignments);
                        studentResults.push({
                            student: stu,
                            eligible,
                            items,
                            total,
                            dateLimit
                        });
                        totalPointsAll += total;
                    });

                    if (!studentResults.length) {
                        $('pointsResult').innerHTML = '<p class="empty-hint">全班目前沒有可加點的項目</p>';
                        return;
                    }

                    const summaryLines = studentResults.map(r => `${r.student.name} +${r.total}點${r.dateLimit ? `（至${r.dateLimit}）` : ''}`).join('、');
                    const ok = await window.askConfirm(`確定要幫全班 ${studentResults.length} 位學生加點嗎？\n共加 ${totalPointsAll} 點。\n\n名單：\n${summaryLines}`);
                    if (!ok) return;

                    const batches = [writeBatch(db)];
                    let opCount = 0;
                    const pointLogsToCreate = [];

                    studentResults.forEach(r => {
                        r.eligible.forEach(g => {
                            g.pointsGiven = true;
                            if (window.__awardedPointsSet) window.__awardedPointsSet.add(`${r.student.id}_${g.assignmentId}`);
                            let curBatch = batches[batches.length - 1];
                            curBatch.set(doc(gradingColl, recordDocId(r.student.id, g.assignmentId)), { pointsGiven: true }, { merge: true });
                            opCount++;
                            if (opCount % 400 === 0) {
                                batches.push(writeBatch(db));
                            }
                        });
                        pointLogsToCreate.push({
                            studentId: r.student.id,
                            studentName: r.student.name,
                            timestamp: Date.now(),
                            dateLabel: todayStr(),
                            totalPoints: r.total,
                            items: r.items,
                            dateLimit: r.dateLimit || ''
                        });
                    });

                    for (const b of batches) {
                        await b.commit().catch(e => console.warn(e));
                    }
                    for (const logData of pointLogsToCreate) {
                        await addDoc(pointLogsColl, logData).catch(e => console.warn(e));
                    }

                    renderGradingTab(gradingRecs, recs, st);
                    const detailsHtml = studentResults.map(r => `<li><strong>${escapeHtml(r.student.name)}</strong>：+${r.total} 點${r.dateLimit ? `（計算到 ${escapeHtml(r.dateLimit)} 的作業）` : ''}</li>`).join('');
                    $('pointsResult').innerHTML = `<p>已成功為全班 <strong>${studentResults.length}</strong> 位學生加點（共 <strong>${totalPointsAll}</strong> 點）：</p><ul style="margin:8px 0 0 20px;padding:0;line-height:1.6">${detailsHtml}</ul>`;
                    return;
                }

                // 單一學生加點模式
                const stu = st.students.find(x=>x.id===sid);
                if(!stu) return;

                const eligible = gradingRecs.filter(g => {
                    if(g.studentId !== sid || isAwarded(g)) return false;
                    const pts = pointsOf(g, st, (window.__extraPastAssignments && window.__extraPastAssignments[g.assignmentId]));
                    return pts > 0;
                });
                if(!eligible.length){
                    $('pointsResult').innerHTML = `<p class="empty-hint">「${stu.name}」目前沒有可加點的項目</p>`;
                    return;
                }
                const items = eligible.map(g => ({
                    assignmentId: g.assignmentId, assignmentName: g.assignmentName,
                    type: g.correctness === '全對' ? '全對' : '訂正完成',
                    points: pointsOf(g, st, (window.__extraPastAssignments && window.__extraPastAssignments[g.assignmentId]))
                }));
                const total = items.reduce((sum,i)=>sum+i.points, 0);
                const dateLimit = getLatestEligibleAssignmentDate(eligible, st, window.__archiveDocsMap, window.__extraPastAssignments);
                const dateMsg = dateLimit ? `\n（計算到 ${dateLimit} 的作業）` : '';
                const ok = await window.askConfirm(`要幫「${stu.name}」加 ${total} 點嗎？${dateMsg}`);
                if(!ok) return;

                const batch = writeBatch(db);
                eligible.forEach(g => {
                    g.pointsGiven = true;
                    if(window.__awardedPointsSet) window.__awardedPointsSet.add(`${sid}_${g.assignmentId}`);
                    batch.set(doc(gradingColl, recordDocId(sid, g.assignmentId)), { pointsGiven: true }, { merge: true });
                });
                await batch.commit().catch(e=>console.warn(e));
                await addDoc(pointLogsColl, {
                    studentId: sid, studentName: stu.name,
                    timestamp: Date.now(), dateLabel: todayStr(),
                    totalPoints: total, items,
                    dateLimit: dateLimit || ''
                }).catch(e=>console.warn(e));
                renderGradingTab(gradingRecs, recs, st);
                const resultDateMsg = dateLimit ? `（計算到 ${dateLimit} 的作業）` : '';
                $('pointsResult').innerHTML = `<p>已幫「${stu.name}」加 <strong>${total}</strong> 點${resultDateMsg}</p>`;
            };

            $('loadPointLogsBtn').onclick = async () => {
                $('pointLogsList').innerHTML = '<p class="empty-hint">載入中…</p>';
                try {
                    const snap = await getDocs(query(pointLogsColl, orderBy('timestamp','desc')));
                    const list = snap.docs.map(d=>({ id:d.id, ...d.data() }));
                    $('pointLogsList').innerHTML = list.length ? list.map(l => {
                        const targetDate = l.dateLimit || getLatestEligibleAssignmentDate(l.items || [], st, window.__archiveDocsMap, window.__extraPastAssignments);
                        const targetDateSuffix = targetDate ? `（計算到 ${escapeHtml(targetDate)} 的作業）` : '';
                        return `
                        <div class="assignment-row">
                            <span class="assignment-name">${escapeHtml(l.dateLabel||'')}　${escapeHtml(l.studentName)}　+${l.totalPoints}點${targetDateSuffix}</span>
                            <button class="btn small outline danger" data-undo-log="${escapeHtml(l.id)}">撤銷</button>
                        </div>`;
                    }).join('') : '<p class="empty-hint">尚無加點紀錄</p>';
                    $('pointLogsList').querySelectorAll('[data-undo-log]').forEach(btn => btn.onclick = async () => {
                        const logId = btn.getAttribute('data-undo-log');
                        const item = list.find(x=>x.id===logId);
                        if(!item) return;
                        const ok2 = await window.askConfirm(`撤銷「${item.studentName} +${item.totalPoints}點」這筆加點紀錄嗎？`);
                        if(!ok2) return;
                        const undoBatch = writeBatch(db);
                        (item.items||[]).forEach(i => {
                            if(window.__awardedPointsSet) window.__awardedPointsSet.delete(`${item.studentId}_${i.assignmentId}`);
                            const gObj = gradingRecs.find(x => x.studentId === item.studentId && x.assignmentId === i.assignmentId);
                            if(gObj) gObj.pointsGiven = false;
                            undoBatch.set(doc(gradingColl, recordDocId(item.studentId, i.assignmentId)), { pointsGiven: false }, { merge: true });
                        });
                        undoBatch.delete(doc(db, 'pointLogs', logId));
                        await undoBatch.commit().catch(e=>console.warn(e));
                        renderGradingTab(gradingRecs, recs, st);
                        $('loadPointLogsBtn').click();
                    });
                } catch(e){ console.warn(e); $('pointLogsList').innerHTML = '<p class="empty-hint">載入失敗</p>'; }
            };
            $('exportTodayPointsBtn').onclick = async () => {
                try {
                    const today = todayStr();
                    const snap = await getDocs(query(pointLogsColl, orderBy('timestamp','desc')));
                    const list = snap.docs.map(d=>d.data()).filter(l => l.dateLabel === today);
                    if(!list.length){ window.showAlert('今天還沒有任何加點紀錄'); return; }
                    const text = list.map(l => {
                        const targetDate = l.dateLimit || getLatestEligibleAssignmentDate(l.items || [], st, window.__archiveDocsMap, window.__extraPastAssignments);
                        const targetDateSuffix = targetDate ? `（計算到 ${targetDate} 的作業）` : '';
                        return `${l.studentName} +${l.totalPoints}點（${(l.items||[]).map(i => typeof i === "object" ? `${i.assignmentName||i.name||"作業"}${i.type?"("+i.type+")":""} +${i.points}點` : i).join("、")}）${targetDateSuffix}`;
                    }).join("\n");
                    await navigator.clipboard.writeText(`${today} 加點紀錄\n${text}`);
                    window.showAlert('今天的加點紀錄已複製');
                } catch(e){ console.warn(e); window.showAlert('匯出失敗，請檢查網路後重試'); }
            };
        }

        function todayISODate(){
            const d = new Date();
            return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
        }
        const DAILY_FIXED_ASSIGNMENTS = [
            { name: '聯絡簿每日任務', needsSign: true }
        ];
        function isSchoolDay(dateStr, st){
            const sem = st.semester || {};
            if(sem.skipWeekends !== false){
                const day = new Date(dateStr + 'T00:00:00').getDay();
                if(day === 0 || day === 6) return false;
            }
            if(sem.startDate && dateStr < sem.startDate) return false;
            if(sem.endDate && dateStr > sem.endDate) return false;
            if(sem.holidays && sem.holidays.includes(dateStr)) return false;
            return true;
        }
        function ensureDailyAssignments(st){
            let changed = false;
            let contactSubj = st.subjects.find(s => s.name === '聯絡簿');
            if(!contactSubj){
                contactSubj = { id: crypto.randomUUID(), name: '聯絡簿', isSystem: true };
                st.subjects = [...st.subjects, contactSubj];
                changed = true;
            }
            const today = todayISODate();
            const schoolDay = isSchoolDay(today, st);
            DAILY_FIXED_ASSIGNMENTS.forEach(fixed => {
                const existing = st.assignments.find(a => a.name === fixed.name);
                if(!existing){
                    st.assignments.push({ id: `daily-${fixed.name}-${today}`, name: fixed.name, subjectId: contactSubj.id, needsSign: fixed.needsSign });
                    changed = true;
                    return;
                }
                if(!schoolDay) return;
                const todayPrefix = `daily-${fixed.name}-${today}`;
                if(!existing.id.startsWith(todayPrefix)){
                    st.assignments = st.assignments.filter(a => a.name !== fixed.name);
                    st.assignments.push({ id: todayPrefix, name: fixed.name, subjectId: contactSubj.id, needsSign: fixed.needsSign });
                    changed = true;
                }
            });
            if(changed) saveSettings({ assignments: st.assignments, subjects: st.subjects });
        }

        function openMakeupStatsModal() {
            const modal = ensureMakeupStatsModalElement();
            const st = settings || { groups: [], students: [], subjects: [], assignments: [] };

            const endInp = document.getElementById('msEndDate');

            const renderDetailRow = (studentId, item, categoryLabel, categoryStyle) => {

                const remarkSpan = item.remark ? `<span style="font-size:0.82em; color:var(--muted); margin-left:6px;">（${escapeHtml(item.remark)}）</span>` : '';
                return `
                    <div style="display:flex; align-items:center; justify-content:space-between; gap:8px; padding:6px 0; border-bottom:1px dashed #c8ccc5; font-size:0.92em;">
                        <div style="flex:1; min-width:0; line-height:1.4;">
                            <span style="display:inline-block; padding:1px 8px; border-radius:10px; font-size:0.8em; margin-right:6px; ${categoryStyle}">${categoryLabel}</span>
                            <strong>${escapeHtml(item.displayName)}</strong>${remarkSpan}
                        </div>
                        <button type="button" class="leave-btn ${item.isLeave ? 'active' : ''}"
                            data-ms-leave-student="${escapeHtml(studentId)}"
                            data-ms-leave-aid="${escapeHtml(item.assignmentId)}"
                            data-ms-leave-doc="${escapeHtml(item.archiveDocId || '')}"
                            data-ms-leave-active="${item.isActive ? '1' : '0'}"
                            data-ms-leave-name="${escapeHtml(item.assignmentName || '')}"
                            data-ms-leave-subj="${escapeHtml(item.subjectName || '')}"

                    </div>
                `;
            };

            const renderStatsContent = () => {
                const scrollTop = bodyEl.scrollTop;
                const opts = getOptions();
                latestStats = computeMakeupAndLeaveStats(opts);
                bannerEl.textContent = `統計範圍共 ${latestStats.assignmentCount} 項作業｜符合條件學生：${latestStats.students.length} 人（全班 ${latestStats.allStudentsCount} 人）`;

                if (!latestStats.students.length) {
                    bodyEl.innerHTML = '<p class="empty-hint">目前篩選期間內沒有任何補繳、未繳或請假紀錄</p>';
                    return;
                }

                const allVisibleExpanded = latestStats.students.filter(s => s.hasAnyRecord).every(s => makeupStatsExpanded.has(s.studentId));
                if (expandAllBtn) expandAllBtn.textContent = allVisibleExpanded ? '全部收合' : '全部展開';

                bodyEl.innerHTML = latestStats.students.map(stItem => {
                    const sName = String(stItem.studentName || '').trim();
                    const hasSeatPrefix = stItem.seat != null && stItem.seat !== '' && !sName.startsWith(String(stItem.seat));
                    const displayStudent = hasSeatPrefix ? `${stItem.seat}號 ${sName}` : sName;
                    const isExp = makeupStatsExpanded.has(stItem.studentId);

                    const badges = [];
                    if (stItem.regularMakeup.length > 0) badges.push(`<span class="stats-pill makeup">已補 ${stItem.regularMakeup.length}</span>`);
                    if (stItem.regularMissing.length > 0) badges.push(`<span class="stats-pill missing">未繳 ${stItem.regularMissing.length}</span>`);
                    if (stItem.totalRegularCount === 0 && stItem.totalLeaveCount === 0) badges.push(`<span class="stats-pill clean">無缺補交</span>`);
                    if (stItem.totalLeaveCount > 0) badges.push(`<span class="stats-pill leave">請假 ${stItem.totalLeaveCount}（已補 ${stItem.leaveMakeup.length}／未繳 ${stItem.leaveMissing.length}）</span>`);

                    const detailsHtml = stItem.hasAnyRecord ? (stItem.subjectGroups || []).map(sg => {

                        if (sg.regularMissing.length > 0) sgBadges.push(`<span class="stats-pill missing" style="font-size:0.76em; padding:1px 8px;">未繳 ${sg.regularMissing.length}</span>`);
                        if (sg.totalLeaveCount > 0) sgBadges.push(`<span class="stats-pill leave" style="font-size:0.76em; padding:1px 8px;">請假 ${sg.totalLeaveCount}（已補 ${sg.leaveMakeup.length}／未繳 ${sg.leaveMissing.length}）</span>`);
                        const sgRows = [

                            ...sg.regularMissing.map(it => renderDetailRow(stItem.studentId, it, '未繳', 'background:rgba(196,103,79,0.14);color:var(--danger);border:1px solid var(--danger);')),
                            ...sg.leaveMakeup.map(it => renderDetailRow(stItem.studentId, it, '請假・已補', 'background:rgba(123,94,167,0.15);color:#7b5ea7;border:1px solid #7b5ea7;')),
                            ...sg.leaveMissing.map(it => renderDetailRow(stItem.studentId, it, '請假・未繳', 'background:rgba(123,94,167,0.15);color:#7b5ea7;border:1px solid #7b5ea7;'))

                        const docId = btn.getAttribute('data-ms-leave-doc');
                        const isActive = btn.getAttribute('data-ms-leave-active') === '1';
                        const aName = btn.getAttribute('data-ms-leave-name') || '';
                        const subjName = btn.getAttribute('data-ms-leave-subj') || '';

                        const stu = (st.students || []).find(x => x.id === sid);
                        const grp = (st.groups || []).find(x => x.id === stu?.groupId);
                        const subjObj = (st.subjects || []).find(x => x.name === subjName);

                        let archiveDoc = null;
                        if (!isActive) {
                            if (docId && Array.isArray(window.__archiveDocsList)) {
                                archiveDoc = window.__archiveDocsList.find(d => (d._id || d.id) === docId) || null;
                            }
                            if (!archiveDoc && window.__archiveDocsMap) {
                                archiveDoc = (docId && window.__archiveDocsMap[docId]) || window.__archiveDocsMap[aid] || null;
                            }
                        }

                        const collidesWithActiveContact = !isActive && (st.assignments || []).some(a => a.name === '聯絡簿每日任務' && a.id === aid);
                        const liveRec = !collidesWithActiveContact ? records.find(r => r.studentId === sid && r.assignmentId === aid) : null;
                        const archRec = archiveDoc && (archiveDoc.records || []).find(r => r.studentId === sid && r.assignmentId === aid);

                        const curStatus = deriveRecordStatus(liveRec, archRec ? archRec.status : '未繳');
                        const curSign = deriveRecordSign(liveRec, archRec ? archRec.signStatus : '未簽名');
                        const curRemark = deriveRecordRemark(liveRec, archRec);
                        const curLeave = isRecordLeave(liveRec, archRec);
                        const curMakeup = isRecordMakeup(liveRec, archRec, curStatus);

                        const nextLeave = !curLeave;
                        const remarkText = toggleLeaveRemark(curRemark, nextLeave);

                        const payload = {
                            groupId: grp ? grp.id : '',
                            groupName: grp ? grp.name : '',
                            studentId: sid,
                            studentName: stu ? stu.name : '',
                            subjectId: subjObj ? subjObj.id : '',
                            subjectName: subjName,
                            assignmentId: aid,
                            assignmentName: aName,
                            status: curStatus,
                            signStatus: curSign,
                            remark: remarkText,
                            isLeave: nextLeave,
                            isMakeup: curMakeup
                        };

                        if (!collidesWithActiveContact) {
                            let r = records.find(rx => rx.studentId === sid && rx.assignmentId === aid);
                            if (r) Object.assign(r, payload); else records.push(payload);
                        }

                        if (archiveDoc) {
                            if (!archiveDoc.records) archiveDoc.records = [];
                            const archIdx = archiveDoc.records.findIndex(x => x.studentId === sid && x.assignmentId === aid);
                            if (archIdx !== -1) {
                                Object.assign(archiveDoc.records[archIdx], {
                                    status: curStatus,
                                    signStatus: curSign,
                                    remark: remarkText,
                                    isLeave: nextLeave,
                                    isMakeup: curMakeup
                                });
                            } else {
                                archiveDoc.records.push({ ...payload });
                            }
                            archiveDoc.records = sanitizeArchiveRecords(archiveDoc.records);
                            const realDocId = archiveDoc._id || archiveDoc.id || docId;
                            if (window.__archiveDocsMap && realDocId) {
                                if (window.__archiveDocsMap[realDocId]) window.__archiveDocsMap[realDocId].records = archiveDoc.records;
                                if (window.__archiveDocsMap[aid] === archiveDoc) window.__archiveDocsMap[aid].records = archiveDoc.records;
                            }
                            if (window.__refreshOpenArchiveDetail && realDocId) {
                                window.__refreshOpenArchiveDetail(realDocId);
                            }
                        }

                        renderStatsContent();
                        renderGradingTab(gradingRecords, records, st);

                        if (!collidesWithActiveContact) {
                            await adminSetStatus(payload);
                        }
                        if (archiveDoc) {
                            const realDocId = archiveDoc._id || archiveDoc.id || docId;
                            if (realDocId) {
                                await setDoc(doc(db, 'archives', realDocId), { records: archiveDoc.records }, { merge: true }).catch(e => console.warn(e));
                            }
                        }
                    };
                });
            };

            if (startInp) startInp.onchange = renderStatsContent;
            if (endInp) endInp.onchange = renderStatsContent;
            if (resetDateBtn) {
                resetDateBtn.onclick = () => {
                    if (startInp) startInp.value = '';
                    if (endInp) endInp.value = '';
                    renderStatsContent();
                };

            if (includeContactChk) includeContactChk.onchange = renderStatsContent;
            if (includeActiveChk) includeActiveChk.onchange = renderStatsContent;
            if (showAllChk) showAllChk.onchange = renderStatsContent;

            if (expandAllBtn) {
                expandAllBtn.onclick = () => {
                    if (!latestStats) return;
                    const withRecords = latestStats.students.filter(s => s.hasAnyRecord);
                    const allExp = withRecords.every(s => makeupStatsExpanded.has(s.studentId));
                    if (allExp) withRecords.forEach(s => makeupStatsExpanded.delete(s.studentId));
                    else withRecords.forEach(s => makeupStatsExpanded.add(s.studentId));
                    renderStatsContent();
                };
            }

            if (copyBtn) {
                copyBtn.onclick = async () => {
                    const opts = getOptions();
                    const stats = computeMakeupAndLeaveStats(opts);

                        className: st.className || '',
                        startDate: opts.startDate,
                        endDate: opts.endDate,
                        includeContactBook: opts.includeContactBook
                    });
                    try {
                        await navigator.clipboard.writeText(reportText);
                        window.showAlert('作業補繳與未繳統計報表已複製！');
                    } catch (e) {
                        window.showAlert('複製失敗，請檢查瀏覽器權限');
                    }
                };
            }

            if (closeBtn) closeBtn.onclick = () => { modal.style.display = 'none'; };

            renderStatsContent();
            modal.style.display = 'flex';
        }

        function openTodayLeaveModal() {
            let modal = document.getElementById('todayLeaveModal');

            const subtitleEl = document.getElementById('todayLeaveSubtitle');

            const renderLeaveStudents = () => {
                const st = settings || { groups: [], students: [], subjects: [], assignments: [] };
                const activeAsgs = st.assignments || [];
                const students = sortBySeat(st.students || []);
                if (!activeAsgs.length) {
                    subtitleEl.textContent = '目前沒有今日作業或聯絡簿可標記請假';
                    boxEl.innerHTML = '<p class="empty-hint" style="padding:10px;">請先新增今日作業</p>';
                    return;
                }
                subtitleEl.textContent = `點選學生即可一鍵切換「請假」（套用至目前 ${activeAsgs.length} 項今日作業與聯絡簿，期中期末將自動歸入「請假另外算」）：`;
                if (!students.length) {
                    boxEl.innerHTML = '<p class="empty-hint" style="padding:10px;">尚未新增學生</p>';
                    return;
                }

                boxEl.innerHTML = students.map(s => {
                    const applicableAsgs = activeAsgs.filter(a => {
                        const subj = (st.subjects || []).find(x => x.id === a.subjectId);
                        return !isPulledOut(s, subj ? subj.name : '', a.name);
                    });
                    const anyLeave = applicableAsgs.some(a => {
                        const rec = records.find(r => r.studentId === s.id && r.assignmentId === a.id);
                        return isRecordLeave(rec, null);
                    });
                    const sName = String(s.name || '').trim();
                    const hasSeat = s.seat != null && s.seat !== '' && !sName.startsWith(String(s.seat));
                    const label = hasSeat ? `${s.seat} ${sName}` : sName;
                    return `<button type="button" class="leave-btn large ${anyLeave ? 'active' : ''}" data-today-leave-student="${escapeHtml(s.id)}">${anyLeave ? '✓ ' : ''}${escapeHtml(label)}</button>`;
                }).join('');

                boxEl.querySelectorAll('[data-today-leave-student]').forEach(btn => {
                    btn.onclick = async () => {
                        const sid = btn.getAttribute('data-today-leave-student');
                        const stu = (st.students || []).find(x => x.id === sid);
                        if (!stu) return;
                        const grp = (st.groups || []).find(x => x.id === stu.groupId);
                        const applicableAsgs = (st.assignments || []).filter(a => {
                            const subj = (st.subjects || []).find(x => x.id === a.subjectId);
                            return !isPulledOut(stu, subj ? subj.name : '', a.name);
                        });
                        const currentlyLeave = applicableAsgs.some(a => {
                            const rec = records.find(r => r.studentId === sid && r.assignmentId === a.id);
                            return isRecordLeave(rec, null);
                        });
                        const nextLeave = !currentlyLeave;

                        const updates = applicableAsgs.map(a => {
                            const subj = (st.subjects || []).find(x => x.id === a.subjectId);
                            const curRec = records.find(r => r.studentId === sid && r.assignmentId === a.id);
                            const curStatus = curRec ? (curRec.status || '未繳') : '未繳';
                            const curSign = curRec ? (curRec.signStatus || '未簽名') : '未簽名';
                            const curRemark = curRec ? (curRec.remark || '') : '';
                            const curMakeup = isRecordMakeup(curRec, null, curStatus);
                            const remarkText = toggleLeaveRemark(curRemark, nextLeave);
                            const payload = {
                                groupId: grp ? grp.id : '',
                                groupName: grp ? grp.name : '',
                                studentId: sid,
                                studentName: stu.name,
                                subjectId: a.subjectId || '',
                                subjectName: subj ? subj.name : '',
                                assignmentId: a.id,
                                assignmentName: a.name,
                                status: curStatus,
                                signStatus: curSign,
                                remark: remarkText,
                                isLeave: nextLeave,
                                isMakeup: curMakeup
                            };
                            if (curRec) Object.assign(curRec, payload); else records.push(payload);
                            return payload;
                        });

                        renderLeaveStudents();
                        renderRecordsTab(records, settings);
                        renderContactTab(records, gradingRecords, settings);
                        renderGradingTab(gradingRecords, records, settings);

                        await Promise.all(updates.map(p => adminSetStatus(p)));
                    };
                });
            };

                            box.style.display = 'block';
                        }
                    });

                    archivesListEl.querySelectorAll('[data-view-archive]').forEach(b => b.onclick = () => {
                        const aid = b.getAttribute('data-view-archive');
                        const item = (window.__archiveDocsMap && window.__archiveDocsMap[aid]) || list.find(x=>x.id===aid);
                        const box = archivesListEl.querySelector(`[data-detail="${aid}"]`);
                        if(box.style.display === 'block'){ box.style.display = 'none'; return; }
                        renderArchiveDetail(item);
                        box.style.display = 'block';
                    });
                    archivesListEl.querySelectorAll('[data-restore-archive]').forEach(b => b.onclick = async () => {
                        const aid = b.getAttribute('data-restore-archive');
                        const item = list.find(x=>x.id===aid);
                        if(!item) return;
                        const label = item.dateLabel || new Date(item.timestamp).toLocaleDateString('zh-TW');
                        const ok2 = await window.askConfirm(`把「${label}」這筆封存快照的繳交/訂正狀態寫回活資料嗎？`);
                        if(!ok2) return;
                        const recBatch = writeBatch(db);
                        const gradeBatch = writeBatch(db);
                        (item.records||[]).forEach(r => {
                            if(r.pulledOut) return;
                            const ref = doc(coll, recordDocId(r.studentId, r.assignmentId));
                            const payload = {
                                groupId: '', groupName: '',
                                studentId: r.studentId, studentName: r.studentName,
                                subjectId: '', subjectName: '',
                                assignmentId: r.assignmentId, assignmentName: r.assignmentName,
                                status: r.status || '未繳',
                                remark: r.remark || '',
                                isLeave: !!r.isLeave,
                                isMakeup: !!r.isMakeup,
                                [ORDER_FIELD]: Date.now()
                            };
                            if(r.signStatus) payload.signStatus = r.signStatus;
                            recBatch.set(ref, payload, { merge: true });
                            if(r.correctness !== undefined){
                                const gref = doc(gradingColl, recordDocId(r.studentId, r.assignmentId));
                                gradeBatch.set(gref, {
                                    studentId: r.studentId, studentName: r.studentName,
                                    assignmentId: r.assignmentId, assignmentName: r.assignmentName,
                                    correctness: r.correctness || '', corrected: !!r.corrected,
                                    updatedAt: Date.now()
                                }, { merge: true });
                            }
                        });
                        await recBatch.commit().catch(e=>console.warn(e));
                        await gradeBatch.commit().catch(e=>console.warn(e));
                        window.showAlert(`已還原「${label}」`);
                    });
                    archivesListEl.querySelectorAll('[data-del-archive]').forEach(b => b.onclick = async () => {
                        const aid = b.getAttribute('data-del-archive');
                        const item = list.find(x=>x.id===aid);
                        const label = item ? (item.dateLabel || new Date(item.timestamp).toLocaleDateString('zh-TW')) : '';
                        const ok2 = await window.askConfirm(`確定刪除「${label}」嗎？`);
                        if(!ok2) return;
                        await deleteDoc(doc(db, 'archives', aid)).catch(e=>{ console.warn(e); window.showAlert('刪除失敗'); });
                        const idsToClean = (item && item.assignments) ? item.assignments.map(a=>a.id) : [];
                        for(const gid of idsToClean){
                            await clearGradingForAssignment(gid);
                            await clearRecordsForAssignment(gid);
                            if(window.__extraPastAssignments) delete window.__extraPastAssignments[gid];
                        }
                        await autoLoadArchives();
                    });
                } catch(e){ console.warn(e); archivesListEl.innerHTML = '<p class="empty-hint">載入失敗</p>'; }
            }
            window.__renderArchivesListFromAuto = renderArchivesList;
            renderArchivesList(window.__archiveDocsList);

            function renderGroups(){
                $('groupsList').innerHTML = st.groups.map(g => `
                    <div class="group-block" data-group="${g.id}">
                        <div class="group-block-head">
                            <strong>${g.name}</strong>
                            <button class="btn small outline danger" data-del-group="${g.id}">刪除組別</button>
                        </div>
                        <div class="chip-list">
                            ${sortBySeat(st.students.filter(s=>s.groupId===g.id)).map(s => `<span class="chip">${s.seat!=null && s.seat!=='' ? s.seat+'號 ' : ''}${s.name}${s.pullout && (s.pullout.chinese||s.pullout.math) ? `<span class="sign-tag" style="color:#b8860c">${pulloutLabel(s.pullout)}</span>` : ''}<button data-pullout-student="${s.id}" title="設定抽離上課" style="color:#b8860c">抽</button><button data-move-student="${s.id}" title="搬到其他組別" style="color:var(--accent)">⇄</button><button data-del-student="${s.id}">✕</button></span>`).join('') || '<span style="color:var(--muted)">尚無學生</span>'}
                        </div>
                        <div class="row inline-add-row" style="margin-bottom:0">
                            <input class="txt-input" data-new-student="${g.id}" placeholder="新增學生姓名">
                            <button class="btn" data-add-student="${g.id}">新增</button>
                        </div>
                    </div>`).join('') || '<p class="empty-hint">尚未新增組別</p>';

                $('groupsList').querySelectorAll('[data-del-group]').forEach(b => b.onclick = () => {
                    resyncFromGlobal();
                    const gid = b.getAttribute('data-del-group');
                    st.groups = st.groups.filter(g=>g.id!==gid);
                    st.students = st.students.filter(s=>s.groupId!==gid);
                    saveSettings({ groups: st.groups, students: st.students });
                    renderGroups();
                });
                $('groupsList').querySelectorAll('[data-del-student]').forEach(b => b.onclick = () => {
                    resyncFromGlobal();
                    const sid = b.getAttribute('data-del-student');
                    st.students = st.students.filter(s=>s.id!==sid);
                    saveSettings({ students: st.students });
                    renderGroups();
                });
                $('groupsList').querySelectorAll('[data-move-student]').forEach(b => b.onclick = async () => {
                    resyncFromGlobal();
                    const sid = b.getAttribute('data-move-student');
                    const stu = st.students.find(x=>x.id===sid);
                    if(!stu) return;
                    const curGroup = st.groups.find(g=>g.id===stu.groupId);
                    const otherGroups = st.groups.filter(g=>g.id!==stu.groupId);
                    if(!otherGroups.length){ window.showAlert('目前沒有其他組別可以搬'); return; }
                    const targetName = await window.askChoice(`「${stu.name}」目前在「${curGroup?curGroup.name:''}」，要搬到哪一組？`, otherGroups.map(g=>g.name));
                    if(!targetName) return;
                    const targetGroup = st.groups.find(g => g.name === targetName);
                    if(!targetGroup) return;
                    resyncFromGlobal();
                    const freshStu = st.students.find(x=>x.id===sid);
                    if(freshStu) freshStu.groupId = targetGroup.id;
                    saveSettings({ students: st.students });
                    renderGroups();
                });
                $('groupsList').querySelectorAll('[data-pullout-student]').forEach(b => b.onclick = () => {
                    resyncFromGlobal();
                    const sid = b.getAttribute('data-pullout-student');
                    const stu = st.students.find(x=>x.id===sid);
                    if(!stu) return;
                    stu.pullout = nextPullout(stu.pullout);
                    saveSettings({ students: st.students });
                    renderGroups();
                });
                $('groupsList').querySelectorAll('[data-add-student]').forEach(b => b.onclick = () => {
                    resyncFromGlobal();
                    const gid = b.getAttribute('data-add-student');
                    const nameInp = $('groupsList').querySelector(`[data-new-student="${gid}"]`);
                    const name = nameInp.value.trim();
                    if(!name) return;
                    st.students.push({ id: crypto.randomUUID(), name, groupId: gid });
                    saveSettings({ students: st.students });
                    renderGroups();
                });
            }

            $('addGroupBtn').onclick = () => {
                resyncFromGlobal();
                const name = $('newGroupName').value.trim();
                if(!name) return;
                st.groups.push({ id: crypto.randomUUID(), name });
                saveSettings({ groups: st.groups });
                $('newGroupName').value = '';
                renderGroups();
            };

            $('toggleGradeMatrixBtn').onclick = () => {
                const body = $('gradeMatrixBody');
                const show = body.style.display === 'none';
                body.style.display = show ? 'block' : 'none';
                $('toggleGradeMatrixBtn').textContent = show ? '收合' : '展開';
            };
            $('toggleArchivedGradingBtn').onclick = () => {
                const body = $('archivedGradingBody');
                const show = body.style.display === 'none';
                body.style.display = show ? 'block' : 'none';
                $('toggleArchivedGradingBtn').textContent = show ? '收合' : '展開';
            };
            $('contactViewSeatBtn').onclick = () => { contactViewMode = 'seat'; renderContactTab(records, gradingRecords, settings || st); };
            $('contactViewGroupBtn').onclick = () => { contactViewMode = 'group'; renderContactTab(records, gradingRecords, settings || st); };
            $('contactLeaveBtn').onclick = () => openTodayLeaveModal();
            $('archiveContactBtn').onclick = async () => {
                resyncFromGlobal();
                const dailyAsg = st.assignments.find(a => a.name === '聯絡簿每日任務');
                if(!dailyAsg){ window.showAlert('目前沒有「聯絡簿每日任務」這項作業'); return; }
                const dateLabel = await window.askInput('這筆聯絡簿封存要標記的日期', todayStr());
                if(dateLabel === null) return;
                const ok2 = await window.askConfirm('確定要封存今天的聯絡簿紀錄嗎？');
                if(!ok2) return;
                resyncFromGlobal();
                const latestDailyAsg = st.assignments.find(a => a.name === '聯絡簿每日任務') || dailyAsg;
                const dSubj = st.subjects.find(x=>x.id===latestDailyAsg.subjectId);
                const students2 = sortBySeat(st.students);
                const snapshotRecords = students2.map(s => {
                    const rec = records.find(r=>r.studentId===s.id && r.assignmentId===latestDailyAsg.id);
                    const g = gradingRecords.find(x=>x.studentId===s.id && x.assignmentId===latestDailyAsg.id);
                    const effStatus = rec ? (rec.status || '未繳') : '未繳';
                    return {
                        studentId: s.id, studentName: s.name,
                        assignmentId: latestDailyAsg.id, assignmentName: latestDailyAsg.name,
                        status: effStatus,
                        signStatus: rec ? (rec.signStatus || '未簽名') : '未簽名',
                        remark: rec ? (rec.remark || '') : '',
                        isLeave: isRecordLeave(rec, null),
                        isMakeup: isRecordMakeup(rec, null, effStatus),
                        correctness: g?g.correctness:'',
                        corrected: g?g.corrected:false,
                        pulledOut: isPulledOut(s, dSubj?dSubj.name:'聯絡簿', latestDailyAsg.name)
                    };
                });
                await addDoc(archivesColl, {
                    timestamp: Date.now(),
                    dateLabel: dateLabel || todayStr(),
                    assignments: [{ id: latestDailyAsg.id, name: latestDailyAsg.name, subjectName: dSubj?dSubj.name:'聯絡簿', needsSign: true }],
                    records: sanitizeArchiveRecords(snapshotRecords),
                    studentCount: st.students.length,
                    assignmentCount: 1
                }).catch(e=>console.warn(e));
                
                await clearRecordsForAssignment(latestDailyAsg.id);
                await clearGradingForAssignment(latestDailyAsg.id);
                
                st.assignments = st.assignments.filter(a => a.name !== '聯絡簿每日任務');
                const newId = `daily-聯絡簿每日任務-${todayISODate()}-${crypto.randomUUID().slice(0,6)}`;
                st.assignments.push({ id: newId, name: '聯絡簿每日任務', subjectId: latestDailyAsg.subjectId, needsSign: true });
                if (settings) settings.assignments = st.assignments;
                await saveSettings({ assignments: st.assignments });
                await autoLoadArchives();
                renderContactTab(records, gradingRecords, settings || st);
                renderGradingTab(gradingRecords, records, settings || st);
                window.showAlert('已封存今天的聯絡簿紀錄，換成新的一輪');
            };

            renderGroups();
            renderRecordsTab(records, settings);
            renderGradingTab(gradingRecords, records, st);
            renderContactTab(records, gradingRecords, st);
            editorReady = true;
        }
    </script>
</body>
</html>
